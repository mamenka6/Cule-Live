const TABS = [['timeline', 'Events'], ['videos', 'Videos'], ['lineups', 'Lineups'], ['stats', 'Stats'], ['ratings', 'Ratings'], ['h2h', 'H2H']];
function isClocked(m) { return !!(Clock.m && String(Clock.m.id) === String(m.id)); }
function mcStateOf(m) { return isClocked(m) ? Clock.state() : stateAt(m, actualIdx(m), { actual: true, official: true }); }
function statusPill(m, st, clocked) {

function mcHeadInner(m, st, clocked, flash = false) {

const ctlLabel = () => `${Clock.mode === 'replay' ? 'Replay' : 'Demo match'} · ${minuteLabel(Clock.state().tick)}`;

function tlRow(m, e, scoreTxt) {
  const n = (id, fb) => esc(pname(m, id, fb));
  let main = '', sub = '';
  switch (e.type) {
    case 'goal': main = e.player != null || e.playerName ? n(e.player, e.playerName) : `${esc(m[e.side].name)} goal`; sub = e.assist != null ? `Assist: ${n(e.assist, e.assistName)}` : 'Goal'; break;
    case 'pen': main = n(e.player, e.playerName); sub = 'Penalty goal'; break;
    case 'own': main = n(e.player, e.playerName); sub = 'Own goal'; break;
    case 'yellow': main = n(e.player, e.playerName) || esc(m[e.side].name); sub = 'Yellow card'; break;
    case 'red': main = n(e.player, e.playerName) || esc(m[e.side].name); sub = e.text || 'Red card'; break;
    case 'sub': if (e.in == null && !e.inName) { main = esc(m[e.side].name); sub = 'Substitution'; } else { main = `On: ${n(e.in, e.inName)}`; sub = `Off: ${n(e.out, e.outName)}`; } break;
    case 'var': main = 'VAR'; sub = `${esc(e.text || 'Check')}${e.player != null ? ' · ' + n(e.player, e.playerName) : ''}`; break;
    case 'pen_miss': main = n(e.player, e.playerName); sub = e.savedBy ? `Penalty saved by ${n(e.savedBy)}` : 'Penalty missed'; break;
  }
  const gv = e.scoreSide && m.source === 'real' ? goalVideo(m, e) : -1;
  const inner = `<b>${main}</b><small>${sub}</small>${scoreTxt ? `<span class="sc">${scoreTxt}</span>` : ''}`;
  const body = e.scoreSide ? `<button class="tl-txt" data-act="goal" data-ev="${prep(m).events.indexOf(e)}" aria-label="Goal details">${inner}</button>` : inner; // tap a goal for its card
  return `<li class="tl-row ${e.side} ${e.scoreSide ? 'goal' : ''}"><div class="tl-ev">${evIcon(e)}<div class="txt">${body}${gv >= 0 ? `<button class="tl-vid" data-act="play-goal" data-i="${gv}">${I.play} Watch goal</button>` : ''}</div></div><span class="tl-min">${evMinute(e)}</span></li>`;
}
function timelineHTML(m, st) {
  if (!st.events.length && st.k <= 0 && m.hlDown) return empty(hlDownMsg(m));
  if (!st.events.length && st.k <= 0) return empty(m.status === 'NS' ? `Kick-off is on ${fmtDayLong(m.ts)}${m.tbc ? ". The time hasn't been announced yet" : ' at ' + fmtTime(m.ts)}. Goals, cards and subs will appear here during the match.` : 'Nothing has happened yet.');
  let h = 0, a = 0, hh = 0, ha = 0;
  const after = new Map();
  st.events.forEach(e => {
    if (!e.scoreSide) return;
    e.scoreSide === 'home' ? h++ : a++;
    if (e.key < 4599) { hh = h; ha = a; }
    after.set(e, `${h}–${a}`);
  });
  const mark = t => `<li class="tl-mark"><span>${t}</span></li>`;
  const items = [{ key: -1, html: mark('Kick-off') }];
  const allGoals = h === st.score.home && a === st.score.away; // false when some goals have no event (no Highlightly data)
  const htTxt = allGoals ? `${hh}–${ha}` : m.htGoals ? `${m.htGoals.home}–${m.htGoals.away}` : '';
  if (st.k >= 4599) items.push({ key: 4599.5, html: mark(htTxt ? `Half-time · ${htTxt}` : 'Half-time') });
  if (st.isFT) items.push({ key: 1e9, html: mark(`Full time · ${st.score.home}–${st.score.away}`) });
  st.events.forEach((e, i) => items.push({ key: e.key + i * 1e-4, html: tlRow(m, e, after.get(e)) }));
  items.sort((x, y) => y.key - x.key); // newest first, like a live feed
  return `${m.hlDown ? `<p class="help tl-note">${hlDownMsg(m)}</p>` : ''}<ol class="tl">${items.map(x => x.html).join('')}</ol>`;
}

function withGrid(xi) {
  const ok = xi.every(p => /^\d+:\d+$/.test(p.grid || ''));
  if (ok) return xi.map(p => { const [r, c] = p.grid.split(':').map(Number); return { ...p, _r: r, _c: c }; });
  const order = ['G', 'D', 'M', 'F'], count = {};
  return xi.map(p => { const r = order.indexOf(p.pos) + 1 || 3; count[r] = (count[r] || 0) + 1; return { ...p, _r: r, _c: count[r] }; });
}
function playerIcons(st, id) {
  let out = '';
  st.events.forEach(e => {
    if (e.player === id && (e.type === 'goal' || e.type === 'pen')) out += I.ball;
    if (e.player === id && e.type === 'yellow') out += CARD.yellow;
    if (e.player === id && e.type === 'red') out += CARD.red;
    if (e.type === 'sub' && e.out === id) out += I.down;
  });
  return out;
}
function sidePlayers(m, st, side) {
  const xi = withGrid(m.lineups[side].xi);
  const rows = {};
  xi.forEach(p => { (rows[p._r] = rows[p._r] || []).push(p); });
  Object.values(rows).forEach(r => r.sort((a, b) => a._c - b._c));
  const R = Math.max(...Object.keys(rows).map(Number));
  const isB = m[side].id === BARCA_ID;
  return xi.map(p => {

// Goal replay: the shot on the pitch, then where it went into the goal. Positions come from ESPN's

  const near = data.shots.filter(s => s.min != null && Math.abs(s.min * 100 + s.extra - e.key) <= 150);

function shotInfo(s, e) {

  const f1 = v => v.toFixed(1);

  const pitch = `<svg class="gc-pitch" viewBox="-2 -2 109 72" role="img" aria-label="Where the shot was taken">${stripes}
    <g class="ln2"><rect x="0" y="0" width="105" height="68"/><line x1="52.5" y1="0" x2="52.5" y2="68"/><circle cx="52.5" cy="34" r="9.15"/>
    <rect x="88.5" y="13.84" width="16.5" height="40.32"/><rect x="99.5" y="24.84" width="5.5" height="18.32"/><rect x="0" y="13.84" width="16.5" height="40.32"/><rect x="0" y="24.84" width="5.5" height="18.32"/></g>
    <rect x="105" y="30.34" width="1.6" height="7.32" class="gc-goalbox"/>

/* ---------- Push notifications ----------
   Alerts that arrive even when the app is closed: lineups announced, kick-off, goals,
   half-time and full time. The free Cloudflare push server (push-worker.js) checks Barça's
   matches every minute and sends them; this part asks the phone for permission and tells
   the server which alerts this device wants. Each device chooses its own alerts. */
const PUSH_KINDS = [['goals', 'Goals'], ['kickoff', 'Kick-off'], ['halftime', 'Half-time'], ['fulltime', 'Full time'], ['lineups', 'Lineups announced']];
const Push = Object.assign({ on: false, prefs: {}, synced: 0, lang: '' }, store.get('push', {}));
PUSH_KINDS.forEach(([k]) => { if (Push.prefs[k] == null) Push.prefs[k] = true; });
const pushSave = () => store.set('push', { on: Push.on, prefs: Push.prefs, synced: Push.synced, lang: Push.lang });
let pushBusy = false;
function pushState() {
  if (!/github\.io$/.test(location.hostname) || !('serviceWorker' in navigator)) return 'site'; // the service worker only runs on the app's website
  if (isIOS() && !isInstalled()) return 'ios'; // iPhones only allow alerts from apps added to the Home Screen
  if (!('PushManager' in window) || !('Notification' in window)) return 'unsupported';
  if (Notification.permission === 'denied') return 'blocked';
  return Push.on && Notification.permission === 'granted' ? 'on' : 'off';
}
const swReady = () => Promise.race([navigator.serviceWorker.ready, new Promise((_, no) => setTimeout(() => no(new Error('Service worker not ready')), 10000))]);
const b64uBytes = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));
const bytesB64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function pushPost(path, body) {
  const res = await fetch(PUSH_SERVER + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const json = await res.json().catch(() => ({}));
  if (!res.ok || json.ok === false) throw new Error(json.error || 'Push server error ' + res.status);
  return json;
}
// This phone's push address, made with the server's key (made again if the server's key changed)
async function pushSubscription() {
  const reg = await swReady();
  const { key } = await (await fetch(PUSH_SERVER + '/vapid')).json();
  let sub = await reg.pushManager.getSubscription();
  if (sub) {
    const cur = sub.options && sub.options.applicationServerKey;
    if (cur && bytesB64u(cur) === key) return sub;
    await sub.unsubscribe();
  }
  return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uBytes(key) });
}
const pushSend = sub => pushPost('/subscribe', { sub: sub.toJSON(), prefs: Push.prefs, lang: LANG });
async function pushEnable() {
  if (pushBusy) return;
  pushBusy = true;
  try {
    const perm = await Notification.requestPermission(); // must come first: iPhones only ask straight after a tap
    if (perm !== 'granted') { toast(perm === 'denied' ? 'Notifications are blocked for Culé Live.' : 'Notifications are still off.'); return; }
    await pushSend(await pushSubscription());
    Object.assign(Push, { on: true, synced: Date.now(), lang: LANG }); pushSave();
    toast('Notifications are on');
  } catch (e) { console.warn('Push:', e); toast("Couldn't turn on notifications. Check your internet connection and try again."); }
  finally { pushBusy = false; render(); }
}
async function pushDisable() {
  try {
    const sub = await (await swReady()).pushManager.getSubscription();
    if (sub) { await pushPost('/unsubscribe', { endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); }
  } catch (e) { /* turned off on this phone anyway */ }
  Push.on = false; pushSave(); toast('Notifications are off'); render();
}
async function pushPrefs() {
  pushSave();
  try { const sub = await (await swReady()).pushManager.getSubscription(); if (sub) await pushSend(sub); toast('Alerts saved'); }
  catch (e) { Push.synced = 0; pushSave(); toast("Couldn't save. It will try again next time you open the app."); }
}
async function pushTest() {
  try {
    const sub = await (await swReady()).pushManager.getSubscription();
    if (!sub) throw new Error('No subscription');
    await pushPost('/test', { sub: sub.toJSON(), lang: LANG });
    toast('Test sent. It should arrive in a few seconds.');
  } catch (e) { toast("The test didn't go through. Turn notifications off and on again."); }
}
// Once a day (and after a language change) remind the server about this phone, in case it lost it
async function pushSync() {
  if (!Push.on) return;
  if (pushState() !== 'on') { if ('Notification' in window && Notification.permission !== 'granted') { Push.on = false; pushSave(); } return; }
  if (Date.now() - Push.synced < 86400e3 && Push.lang === LANG) return;
  try { await pushSend(await pushSubscription()); Object.assign(Push, { synced: Date.now(), lang: LANG }); pushSave(); } catch (e) { /* try again next time */ }
}
function pushHTML() {
  const st = pushState();
  const msg = {
    site: 'Open Culé Live from its website to turn on notifications.',
    ios: 'On iPhone, add Culé Live to your Home Screen first (Share button, then Add to Home Screen). Then open it from there and turn on notifications here.',
    unsupported: "This browser can't show notifications. Try Chrome, or install the app.",
    blocked: 'Notifications are blocked for Culé Live. Allow them in your phone or browser settings, then come back here.'
  }[st];
  if (msg) return `<p class="help">${msg}</p>`;
  if (st === 'off') return `<p class="help">Get alerts on your phone even when the app is closed.</p><button class="btn btn-primary" data-act="push-on">Turn on notifications</button>`;
  return `<p class="help">Send me alerts for:</p>
    ${PUSH_KINDS.map(([k, label]) => `<label class="switch" for="push-${k}"><input type="checkbox" id="push-${k}" data-push="${k}" ${Push.prefs[k] ? 'checked' : ''}><span>${label}</span></label>`).join('')}
    <p class="help">During matches, alerts can be a few minutes behind.</p>
    <div class="row"><button class="btn btn-ghost" data-act="push-test">Send a test</button><button class="btn btn-ghost" data-act="push-off">Turn off</button></div>`;
}

/* ---------- 8. Buttons, router and start-up ---------- */
const VIEWS = { home: viewHome, matches: viewMatches, table: viewTable, squad: viewSquad, options: viewOptions, dev: viewSetup, match: viewMatch };
const NAV = [['home', 'Home'], ['matches', 'Matches'], ['table', 'Table'], ['squad', 'Squad'], ['options', 'Settings']];
const HIDDEN = { dev: 'dev', setup: 'options' }; // #dev = developer page, old #setup links go to Settings
function route() {
  const h = location.hash.slice(1);
  if (h.startsWith('match-')) return { name: 'match', id: h.slice(6) };
  if (HIDDEN[h]) return { name: HIDDEN[h] };
  return { name: NAV.some(([k]) => k === h) ? h : 'home' };
}
const routeKey = r => r.name + (r.id ? ':' + r.id : '');

let renderSeq = 0;
async function render() {
  const seq = ++renderSeq, r = route(), view = $('#view');
  if (r.name !== 'match') state.lastTab = r.name;
  document.querySelectorAll('.tab').forEach(t => { if (t.dataset.tab === (r.name === 'match' ? state.lastTab : r.name)) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
  const sameView = view.dataset.route === routeKey(r);
  if (!sameView) { closeSheet(false); view.innerHTML = '<div class="loading">Loading…</div>'; window.scrollTo(0, 0); }
  let html;
  try { html = await VIEWS[r.name](r); }
  catch (e) { html = errorHTML(e); }
  if (seq !== renderSeq) return;
  view.innerHTML = html; view.dataset.route = routeKey(r);
  if (r.name === 'match' && state.sheetPid && !/^(season|goal):/.test(String(state.sheetPid))) Data.match(r.id).then(m => { const c = $('#sheet-content'); if (c) c.innerHTML = sheetBodyHTML(m, mcStateOf(m), state.sheetPid); }).catch(() => {});
}
function errorHTML(e) {
  const msg = e instanceof AppError ? e.message : 'Something went wrong while loading. Please try again.';
  if (!(e instanceof AppError)) console.warn(e);
  return `<div class="errbox" role="alert"><b>Couldn't load this</b><p>${esc(msg)}</p><div class="row"><button class="btn btn-ghost" data-act="retry">Try again</button>${settings.mode === 'api' ? '<button class="btn btn-ghost" data-act="dev-reset">Back to normal</button>' : ''}</div></div>`;
}

// Called every time the clock moves: only the parts that change are redrawn
function onClockChange(fresh) {
  const r = route(), goal = fresh.some(e => e.scoreSide);
  if (r.name === 'home' && Clock.m === DEMO_LIVE) {
    const dyn = $('#lc-dyn'); if (dyn) dyn.innerHTML = lcDynHTML(DEMO_LIVE, Clock.state(), 'demo', goal);
    const snap = $('#table-snap'); if (snap) snap.innerHTML = tableSnapHTML(demoTable());
  } else if (r.name === 'match' && Clock.m && String(Clock.m.id) === r.id) {
    const st = Clock.state();
    const head = $('#mc-head'); if (head) head.innerHTML = mcHeadInner(Clock.m, st, true, goal);
    const panel = $('#mc-panel'); if (panel && state.mcTab !== 'h2h') panel.innerHTML = panelHTML(Clock.m, st, true);
    const sheet = $('#sheet-content'); if (sheet && state.sheetPid) sheet.innerHTML = sheetBodyHTML(Clock.m, st, state.sheetPid);
  } else if (r.name === 'matches' && Clock.m === DEMO_LIVE) {
    const row = $('#live-row'); if (row) row.outerHTML = fxRowHTML(DEMO_LIVE);
  } else if (r.name === 'table' && Clock.m === DEMO_LIVE) {
    const body = $('#table-body'); if (body) body.innerHTML = demoTable().rows.map(x => tableRowHTML(x, false)).join('');
  }
  syncControls();
}
function syncControls() {
  document.querySelectorAll('[data-act="clock-toggle"]').forEach(b => { b.innerHTML = Clock.playing ? I.pause : I.play; b.setAttribute('aria-label', Clock.playing ? 'Pause' : 'Play'); });
  document.querySelectorAll('[data-act="speed"]').forEach(b => b.setAttribute('aria-pressed', String(Clock.speed === +b.dataset.speed)));
  const s = $('#scrub'); if (s && Clock.m) { s.max = Clock.max; if (!state.scrubbing) s.value = Clock.idx; }
  const l = $('#ctl-label'); if (l && Clock.m) l.textContent = ctlLabel();
}

async function startReplay(id) {
  try {
    const m = await Data.match(id);
    Clock.load(m, 'replay', 0); Clock.speed = 3; Clock.play();
    $('#view').dataset.route = ''; render();
  } catch (e) { toast(esc(e.message || 'Could not start the replay.')); }
}
function startDemo() {
  DEMO_LIVE.ts = Date.now() - 11 * 60e3;
  Clock.load(DEMO_LIVE, 'demo', tickIndexFor(DEMO_LIVE, 11)); Clock.speed = 1; Clock.play();
}
function resetApp() {
  Clock.unload(); state.gen++; state.fixtures = null; state.cache = {}; state.source = null; FD.downUntil = 0; demoList = null;
  if (settings.mode === 'demo') startDemo();
  if (settings.mode === 'real') { SR.connect(); loadCrests(); }
  updateModeChip(); schedulePoll();
  $('#view').dataset.route = ''; render();
}
function updateModeChip() {
  const c = $('#mode-chip');
  c.textContent = settings.mode === 'demo' ? 'Demo data' : settings.mode === 'real' ? (SR.live ? 'Real · live' : 'Real data') : `API · ${seasonLabel(settings.season)}`;
  c.classList.toggle('api', settings.mode !== 'demo');
}

// API mode: refresh live matches every few seconds (only while the page is visible)
let pollTimer;
function schedulePoll() {
  clearInterval(pollTimer);
  if (settings.mode !== 'api' && !(settings.mode === 'real' && settings.server)) return;
  pollTimer = setInterval(async () => {
    if (document.hidden || !state.fixtures || ['dev', 'options'].includes(route().name)) return;
    const live = state.fixtures.find(isLiveF);
    const soon = state.fixtures.find(f => f.status === 'NS' && f.ts - Date.now() < 15 * 60e3 && f.ts - Date.now() > -3 * 3600e3);
    if (!live && !soon) return;
    try { await Data.fixtures(true); if (live) await Data.match(live.id, true); render(); } catch (e) { /* try again next time */ }
  }, (settings.mode === 'real' ? Math.max(30, settings.refresh) : settings.refresh) * 1000);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  switch (act) {
    case 'clock-toggle': Clock.toggle(); break;
    case 'speed': Clock.setSpeed(+b.dataset.speed); break;
    case 'clock-restart': Clock.seek(0); if (!Clock.playing) Clock.play(); syncControls(); break;
    case 'replay': startReplay(b.dataset.id); break;
    case 'replay-exit': Clock.unload(); $('#view').dataset.route = ''; render(); break;
    case 'mc-tab': {
      state.mcTab = b.dataset.tab;
      document.querySelectorAll('[data-act="mc-tab"]').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === state.mcTab)));
      refreshPanel();
      break;
    }
    case 'player': openPlayer(b.dataset.pid, b); break;
    case 'goal': openGoal(+b.dataset.ev, b); break;
    case 'goal-replay': showReplay(); break;
    case 'season-player': openSeasonPlayer(b.dataset.pid, b); break;
    case 'sheet-close': closeSheet(); break;
    case 'load-season':
      b.disabled = true; b.textContent = 'Loading…';
      hlSeason(true).then(() => render()).catch(() => { toast('Could not load season stats right now.'); render(); });
      break;
    case 'mtab': state.matchTab = b.dataset.tab; render(); break;
    case 'go-results': state.matchTab = 'results'; break;
    case 'comp': state.comp = b.dataset.comp; render(); break;
    case 'pred': {
      const id = b.dataset.id, k = b.dataset.k, d = state.pred[id] || (state.pred[id] = { b: 2, o: 1 });
      d[k] = Math.max(0, Math.min(15, d[k] + Number(b.dataset.d)));
      const out = document.getElementById(`pred-${id}-${k}`); if (out) out.textContent = d[k];
      break;
    }
    case 'pred-save': {
      const id = b.dataset.id, d = state.pred[id]; if (!d) break;
      const f = (state.fixtures || []).find(x => String(x.id) === b.dataset.fid); if (!f) break;
      savePred(f, d).then(where => {
        const note = document.getElementById('pred-note-' + id); if (note) note.textContent = `Saved: Barça ${d.b}–${d.o}`;
        toast(where === 'cloud' ? 'Prediction saved to your account' : where === 'local-error' ? "Saved on this device. It will go to your account next time you're online." : 'Prediction saved');
      });
      break;
    }
    case 'mode':
      settings.picked = true; devChange();
      if (settings.mode !== b.dataset.mode) { settings.mode = b.dataset.mode; saveSettings(); resetApp(); }
      break;
    case 'key-show': { const inp = $('#api-key'); inp.type = inp.type === 'password' ? 'text' : 'password'; b.textContent = inp.type === 'password' ? 'Show' : 'Hide'; break; }
    case 'key-save':
      devChange(); settings.apiKey = $('#api-key').value.trim(); saveSettings();
      toast(settings.apiKey ? 'Key saved' : 'Key removed');
      if (settings.mode === 'api') { state.fixtures = null; schedulePoll(); }
      break;
    case 'server-save': {
      let v = $('#server').value.trim();
      if (v && !/^https?:\/\//i.test(v)) v = 'https://' + v;
      devChange(); settings.server = v; saveSettings(); $('#server').value = v;
      toast(v ? 'Server saved' : 'Server removed');
      state.fixtures = null; schedulePoll(); break;
    }
    case 'status': {
      const out = $('#status-out'); out.textContent = 'Checking…';
      Data.status().then(t => { out.textContent = t; }).catch(err => { out.textContent = err.message; });
      break;
    }
    case 'clear-cache': store.clear('cache:'); state.fixtures = null; state.cache = {}; toast('Saved match data cleared'); break;
    case 'use-demo': devChange(); settings.mode = 'demo'; saveSettings(); resetApp(); break;
    case 'dev-reset': // back to the normal app
      settings.dev = false; Object.assign(settings, DEFAULTS); saveSettings(); store.clear('cache:'); store.clear('planCheck');
      toast('App reset'); resetApp(); break;
    case 'lang': if (b.dataset.lang !== LANG) { settings.lang = b.dataset.lang; saveSettings(); location.reload(); } break;
    case 'play': playVideo(+b.dataset.i); break;
    case 'play-goal': {
      closeSheet(false);
      state.mcTab = 'videos';
      document.querySelectorAll('[data-act="mc-tab"]').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === 'videos')));
      const r = route(); if (r.name !== 'match') break;
      Data.match(r.id).then(m => { const p = $('#mc-panel'); if (!p) return; p.innerHTML = panelHTML(m, mcStateOf(m), isClocked(m)); playVideo(+b.dataset.i); $('#vid-' + b.dataset.i)?.scrollIntoView({ block: 'center' }); }).catch(() => {});
      break;
    }
    case 'push-on': pushEnable(); break;
    case 'push-off': pushDisable(); break;
    case 'push-test': pushTest(); break;
    case 'install': if (installPrompt) { installPrompt.prompt(); installPrompt.userChoice.finally(() => { installPrompt = null; render(); }); } break;
    case 'acct-google': acctGoogle(); break;
    case 'acct-mode': Acct.mode = Acct.mode === 'up' ? 'in' : 'up'; Acct.error = ''; render(); break;
    case 'acct-forgot': acctForgot(); break;
    case 'acct-out': acctSignOut(); break;
    case 'refresh-data': store.clear('cache:'); state.fixtures = null; state.cache = {}; toast('Match data refreshed'); $('#view').dataset.route = ''; render(); break;
    case 'retry': $('#view').dataset.route = ''; render(); break;
  }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'acct-form') { e.preventDefault(); acctEmail(e.target); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'season') { devChange(); settings.season = +t.value; saveSettings(); state.fixtures = null; if (Clock.mode === 'replay') Clock.unload(); updateModeChip(); }
  if (t.id === 'refresh') { devChange(); settings.refresh = +t.value; saveSettings(); schedulePoll(); }
  if (t.id === 'alerts') { settings.alerts = t.checked; saveSettings(); }
  if (t.dataset.push) { Push.prefs[t.dataset.push] = t.checked; pushPrefs(); }
  if (t.id === 'scrub') state.scrubbing = false;
});
document.addEventListener('input', e => { if (e.target.id === 'scrub') { state.scrubbing = true; Clock.seek(+e.target.value); } });
document.addEventListener('pointerup', () => { state.scrubbing = false; });
window.addEventListener('hashchange', render);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
setInterval(() => document.querySelectorAll('[data-count]').forEach(el => { el.textContent = countdown(+el.dataset.count); }), 30000);
setInterval(() => {
  document.querySelectorAll('[data-clock]').forEach(el => { const t = clockText(el.dataset.clock); if (t) el.textContent = t; });
  document.querySelectorAll('[data-ago]').forEach(el => { el.textContent = agoText(); });
}, 1000);

// When the API-Football plan is upgraded from Free, switch to this season's live data by itself
async function checkPlan() {
  const server = (settings.server || '').trim().replace(/\/+$/, '');
  if (!server || settings.picked || settings.mode === 'api') return;
  if (Date.now() - store.get('planCheck', 0) < 3600e3) return; // check at most once an hour
  try {
    const res = await fetch(server + '/status');
    const json = await res.json();
    const r = Array.isArray(json.response) ? json.response[0] : json.response;
    store.set('planCheck', Date.now());
    const plan = r?.subscription?.plan;
    if (plan && plan !== 'Free') { settings.mode = 'api'; settings.season = 2026; saveSettings(); resetApp(); toast('Live data for this season is now on'); }
  } catch (e) { /* not reachable here: keep the built-in data */ }
}
(function init() {
  startTranslating();
  if ('serviceWorker' in navigator && /github\.io$/.test(location.hostname)) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* works without it, just not offline */ });
    navigator.serviceWorker.addEventListener('message', e => { if (e.data && typeof e.data.open === 'string') location.hash = e.data.open; }); // a tapped alert opens its match
    pushSync();
  }
  acctStart(); acctButton();
  $('#tabbar').innerHTML = NAV.map(([k, label]) => `<a class="tab" href="#${k}" data-tab="${k}">${I[k]}<span>${label}</span></a>`).join('');
  updateModeChip();
  if (settings.mode === 'demo') startDemo();
  if (settings.mode === 'real') { SR.connect(); setTimeout(loadCrests, 1500); }
  schedulePoll();
  render();
  checkPlan();
})();
</script>
