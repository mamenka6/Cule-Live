/* ---------- 5. Match engine ----------
   A match is split into "ticks" (one per minute, plus added time, half-time and full-time).
   stateAt(match, tick) works out everything at that moment: score, events so far,
   who is on the pitch, player ratings and stats. Replays just move through the ticks. */
function buildTicks(m) {
  const ev = m.events || [];
  const maxExtra = minute => Math.max(0, ...ev.filter(e => e.min === minute).map(e => e.extra || 0));
  let s1 = Math.max(m.added?.h1 ?? 2, maxExtra(45));
  let s2 = Math.max(m.added?.h2 ?? 3, maxExtra(90));
  if (m.elapsed === 45 && m.extraNow) s1 = Math.max(s1, m.extraNow);
  if (m.elapsed === 90 && m.extraNow) s2 = Math.max(s2, m.extraNow);
  const ticks = [];
  for (let i = 0; i <= 45; i++) ticks.push({ min: i, extra: 0 });
  for (let i = 1; i <= s1; i++) ticks.push({ min: 45, extra: i });
  ticks.push({ min: 45, extra: 99, ht: true });
  for (let i = 46; i <= 90; i++) ticks.push({ min: i, extra: 0 });
  for (let i = 1; i <= s2; i++) ticks.push({ min: 90, extra: i });
  if (ev.some(e => e.min > 90) || ['AET', 'PEN', 'ET', 'BT', 'P'].includes(m.short)) {
    const s3 = Math.max(1, maxExtra(105)), s4 = Math.max(1, maxExtra(120));
    for (let i = 91; i <= 105; i++) ticks.push({ min: i, extra: 0 });
    for (let i = 1; i <= s3; i++) ticks.push({ min: 105, extra: i });
    for (let i = 106; i <= 120; i++) ticks.push({ min: i, extra: 0 });
    for (let i = 1; i <= s4; i++) ticks.push({ min: 120, extra: i });
  }
  ticks.push({ min: 999, extra: 0, ft: true });
  ticks.forEach(t => { t.key = t.min * 100 + t.extra; });
  return ticks;
}

function prep(m) {
  if (m._prep) return m._prep;
  const ticks = buildTicks(m);
  const idx = {};
  for (const side of ['home', 'away']) {
    const L = m.lineups?.[side]; if (!L) continue;
    L.xi.forEach(p => { idx[p.id] = { p, side, starter: true }; });
    L.bench.forEach(p => { idx[p.id] = { p, side, starter: false }; });
  }
  const events = (m.events || []).map((e, i) => ({ ...e, key: e.min * 100 + (e.extra || 0), n: i })).sort((a, b) => a.key - b.key || a.n - b.n);
  events.forEach(e => {
    if (e.type === 'goal' || e.type === 'pen') e.scoreSide = e.side;
    if (e.type === 'own') e.scoreSide = other(e.side);
  });
  // Own goals: check against the final score and flip if needed
  if (m.status === 'FT' && m.goals?.home != null && events.some(e => e.type === 'own')) {
    const c = { home: 0, away: 0 }; events.forEach(e => { if (e.scoreSide) c[e.scoreSide]++; });
    if (c.home !== m.goals.home || c.away !== m.goals.away) events.forEach(e => { if (e.type === 'own') e.scoreSide = e.side; });
  }
  const playKeys = ticks.filter(t => !t.ht && !t.ft && t.key > 0).map(t => t.key);
  return (m._prep = { ticks, idx, events, playKeys });
}

const minutesBetween = (P, fromKey, toKey) => { let n = 0; for (const k of P.playKeys) if (k > fromKey && k <= toKey) n++; return n; };
const shareAt = (P, key) => P.playKeys.length ? minutesBetween(P, -1, key) / P.playKeys.length : 0;

function stateAt(m, i, opt = {}) {
  const P = prep(m);
  i = Math.max(0, Math.min(i, P.ticks.length - 1));
  const tick = P.ticks[i], k = tick.key;
  const events = P.events.filter(e => e.key <= k);
  const score = { home: 0, away: 0 };
  events.forEach(e => { if (e.scoreSide) score[e.scoreSide]++; });
  if (opt.actual && m.goals?.home != null) { score.home = m.goals.home; score.away = m.goals.away; }

  // When each player came on and went off
  const spans = {};
  for (const id in P.idx) if (P.idx[id].starter) spans[id] = { inKey: 0, outKey: Infinity };
  for (const e of events) {
    if (e.type === 'sub') { if (spans[e.out]) spans[e.out].outKey = e.key; if (e.in != null && P.idx[e.in]) spans[e.in] = { inKey: e.key, outKey: Infinity }; }
    if (e.type === 'red' && spans[e.player]) spans[e.player].outKey = e.key;
  }
  const minutes = {}, ratings = {};
  for (const id in spans) {
    const s = spans[id];
    minutes[id] = minutesBetween(P, s.inKey, Math.min(s.outKey, k));
    const off = opt.official && m.official && m.official[id] != null;
    ratings[id] = off ? m.official[id] : m.noRatings ? null : rateByFormula(P, id, s, minutes[id], events); // backup lineups come without ratings
  }
  const progress = shareAt(P, k);
  const stats = statsAt(m, i, events, score, progress, opt.actual);
  return { i, tick, k, events, score, spans, minutes, ratings, stats, progress, isFT: !!tick.ft, isHT: !!tick.ht };
}

/* Culé Live's own rating formula (used for the demo and for replays).
   Everyone starts at 6.0 and goes up or down with what happens while they play. */
function rateByFormula(P, id, span, mins, events) {
  if (mins < 1) return null;
  const { side, p } = P.idx[id];
  const defensive = p.pos === 'G' || p.pos === 'D';
  const share = Math.min(1, mins / 90);
  let r = 6.0 + 0.6 * share + (seedOf(id) - 0.5) * 0.6 * share; // playing time + a little "form"
  let conceded = 0;
  for (const e of events) {
    if (e.player === id) {
      if (e.type === 'goal') r += 1.0;
      if (e.type === 'pen') r += 0.8;
      if (e.type === 'own') r -= 1.0;
      if (e.type === 'yellow') r -= 0.3;
      if (e.type === 'red') r -= 1.5;
      if (e.type === 'pen_miss') r -= 0.6;
    }
    if (e.assist === id && (e.type === 'goal' || e.type === 'pen')) r += 0.6;
    if (e.savedBy === id) r += 0.8;
    if (e.scoreSide && e.key > span.inKey && e.key <= span.outKey) {
      if (e.scoreSide === side) r += 0.1;
      else { conceded++; r -= defensive ? 0.25 : 0.1; }
    }
  }
  if (defensive && mins >= 60 && conceded === 0) r += 0.3; // clean sheet bonus
  return Math.round(Math.max(3, Math.min(10, r)) * 10) / 10;
}

const STAT_ROWS = [['possession', 'Possession', '%'], ['xg', 'Expected goals (xG)', ''], ['bigChances', 'Big chances', ''], ['shots', 'Total shots', ''], ['sot', 'Shots on target', ''], ['shotsOff', 'Shots off target', ''], ['shotsIn', 'Shots inside the box', ''], ['shotsOut', 'Shots outside the box', ''], ['blocked', 'Blocked shots', ''], ['corners', 'Corners', ''], ['keyPasses', 'Key passes', ''], ['passes', 'Passes', ''], ['passAcc', 'Pass accuracy', '%'], ['tackles', 'Tackles', ''], ['interceptions', 'Interceptions', ''], ['clearances', 'Clearances', ''], ['fouls', 'Fouls', ''], ['offsides', 'Offsides', ''], ['yellow', 'Yellow cards', ''], ['red', 'Red cards', ''], ['saves', 'Goalkeeper saves', ''], ['freeKicks', 'Free kicks', ''], ['throwIns', 'Throw-ins', '']];

// Final stats are known; during a replay they grow in step with the clock.
function statsAt(m, i, events, score, f, actual) {
  const fin = m.stats;
  if (!fin || !fin.home || !fin.away) return null;
  if (actual) return fin;
  const out = { home: {}, away: {} };
  for (const side of ['home', 'away']) {
    const F = fin[side], o = out[side];
    const grow = key => F[key] == null ? null : Math.round(F[key] * f);
    ['shots', 'sot', 'shotsIn', 'shotsOut', 'blocked', 'corners', 'fouls', 'offsides', 'passes', 'saves'].forEach(key => { o[key] = grow(key); });
    o.xg = F.xg == null ? null : Math.round(F.xg * f * 100) / 100;
    o.passAcc = F.passAcc ?? null;
    if (o.sot != null) o.sot = Math.max(o.sot, score[side]);
    if (o.shots != null && o.sot != null) o.shots = Math.max(o.shots, o.sot);
    o.yellow = events.filter(e => e.side === side && e.type === 'yellow').length;
    o.red = events.filter(e => e.side === side && e.type === 'red').length;
    if (o.offsides != null) o.offsides = Math.max(o.offsides, events.filter(e => e.side === side && e.type === 'var' && /offside/i.test(e.text || '')).length);
  }
  for (const side of ['home', 'away']) {
    const opp = other(side);
    if (out[side].saves != null && out[opp].sot != null) out[side].saves = Math.min(out[side].saves, Math.max(0, out[opp].sot - score[opp]));
  }
  if (fin.home.possession != null) {
    const wobble = (1 - f) * 6 * Math.sin(i * 0.7); // possession moves around early, then settles
    const h = Math.round(Math.max(30, Math.min(70, fin.home.possession + wobble)));
    out.home.possession = h; out.away.possession = 100 - h;
  }
  return out;
}

const minuteLabel = t => !t ? '' : t.ft ? 'FT' : t.ht ? 'HT' : t.extra ? `${t.min}+${t.extra}'` : `${t.min}'`;
const evMinute = e => e.extra ? `${e.min}+${e.extra}'` : `${e.min}'`;

function actualIdx(m) {
  const T = prep(m).ticks;
  if (m.status === 'FT') return T.length - 1;
  if (m.status === 'NS' || m.status === 'OFF') return 0;
  if (m.status === 'HT') return T.findIndex(t => t.ht);
  if (m.elapsed == null) { // live but the minute is unknown: estimate it from the kick-off time (15-minute break), never behind the latest event
    const mins = (Date.now() - m.ts) / 60e3, est = mins <= 48 ? mins : mins < 63 ? 45 : Math.min(90, mins - 15);
    const k = Math.max(Math.max(1, Math.floor(est)) * 100, ...prep(m).events.map(e => e.key));
    let j = 0; T.forEach((t, x) => { if (!t.ft && !t.ht && t.key <= k) j = x; }); return j;
  }
  const k = (m.elapsed || 0) * 100 + (m.extraNow || 0);
  let i = 0; T.forEach((t, j) => { if (!t.ft && !t.ht && t.key <= k) i = j; });
  return i;
}
const tickIndexFor = (m, minute) => Math.max(0, prep(m).ticks.findIndex(t => t.key >= minute * 100));

/* ---------- 6. Match clock ----------
   Moves through a match one tick at a time: the live demo and replays both use it. */
const Clock = {
  m: null, mode: null, idx: 0, playing: false, speed: 1, timer: null, memo: null,
  load(m, mode, idx = 0) { this.stop(); this.m = m; this.mode = mode; this.idx = idx; this.memo = null; },
  stop() { this.playing = false; clearTimeout(this.timer); },
  unload() { this.stop(); this.m = null; this.mode = null; },
  get max() { return prep(this.m).ticks.length - 1; },
  state() {
    if (!this.m) return null;
    if (this.memo && this.memo.i === this.idx && this.memo.m === this.m) return this.memo.st;
    const st = stateAt(this.m, this.idx);
    this.memo = { i: this.idx, m: this.m, st };
    return st;
  },
  play() { if (!this.m) return; if (this.idx >= this.max) this.idx = 0; this.playing = true; this.schedule(); },
  toggle() { if (this.playing) this.stop(); else this.play(); onClockChange([]); },
  schedule() {
    clearTimeout(this.timer);
    if (!this.playing) return;
    const t = prep(this.m).ticks[this.idx];
    this.timer = setTimeout(() => this.step(), (t.ht ? 3500 : 1000) / this.speed);
  },
  step() {
    const P = prep(this.m);
    if (this.idx >= this.max) { this.stop(); onClockChange([]); return; }
    const before = P.ticks[this.idx].key;
    this.idx++;
    const t = P.ticks[this.idx];
    const fresh = P.events.filter(e => e.key > before && e.key <= t.key);
    if (settings.alerts) {
      fresh.forEach(e => alertFor(this.m, e));
      if (t.ht) toast(`<b>Half-time</b><span>${scoreLine(this.m, this.state().score)}</span>`);
      if (t.ft) toast(`<b>Full time</b><span>${scoreLine(this.m, this.state().score)}</span>`);
    }
    if (t.ft) this.stop();
    onClockChange(fresh);
    if (this.playing) this.schedule();
  },
  seek(i) { this.idx = Math.max(0, Math.min(i, this.max)); onClockChange([]); if (this.playing) this.schedule(); },
  setSpeed(s) { this.speed = s; if (this.playing) this.schedule(); onClockChange([]); }
};

/* --- Predictions ---

   and in your account when you're signed in. */
const predKey = f => { const d = new Date(f.ts); return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}-${barcaSide(f) === 'home' ? 'H' : 'A'}`; };

  if (!p) { // move a prediction saved by an older version (under the match ID) to the new key
    for (const id of [f.id, f.srTwin?.id, f.hlId && 'h' + f.hlId].filter(Boolean)) {
      const old = store.get('pred:' + id, null);
      if (old && old.b != null) { p = { b: old.b, o: old.o, at: old.at || Date.now() }; store.set('pred:' + k, p); break; }

}

function tlRow(m, e, scoreTxt) {
  const n = (id, fb) => esc(pname(m, id, fb));
  let main = '', sub = '';
  switch (e.type) {
    case 'goal': main = e.player != null || e.playerName ? n(e.player, e.playerName) : `${esc(m[e.side].name)} goal`; sub = e.assist != null ? `Assist: ${n(e.assist, e.assistName)}` : 'Goal'; break;
    case 'pen': main = n(e.player, e.playerName); sub = 'Penalty goal'; break;
    case 'own': main = n(e.player, e.playerName); sub = 'Own goal'; break;
    case 'yellow': main = n(e.player, e.playerName) || esc(m[e.side].name); sub = 'Yellow card'; break;
    case 'red': main = n(e.player, e.playerName) || esc(m[e.side].name); sub = e.text || 'Red card'; break;
    case 'sub': if (e.in == null && !e.inName) { main = esc(m[e.side].name); sub = 'Substitution'; } else { main = `On: ${n(e.in, e.inName)}`; sub = `Off: ${n(e.out, e.outName)}`; } break;
    case 'var': main = 'VAR'; sub = `${esc(e.text || 'Check')}${e.player != null ? ' · ' + n(e.player, e.playerName) : ''}`; break;
    case 'pen_miss': main = n(e.player, e.playerName); sub = e.savedBy ? `Penalty saved by ${n(e.savedBy)}` : 'Penalty missed'; break;
  }
  const gv = e.scoreSide && m.source === 'real' ? goalVideo(m, e) : -1;
  const inner = `<b>${main}</b><small>${sub}</small>${scoreTxt ? `<span class="sc">${scoreTxt}</span>` : ''}`;
  const body = e.scoreSide ? `<button class="tl-txt" data-act="goal" data-ev="${prep(m).events.indexOf(e)}" aria-label="Goal details">${inner}</button>` : inner; // tap a goal for its card
  return `<li class="tl-row ${e.side} ${e.scoreSide ? 'goal' : ''}"><div class="tl-ev">${evIcon(e)}<div class="txt">${body}${gv >= 0 ? `<button class="tl-vid" data-act="play-goal" data-i="${gv}">${I.play} Watch goal</button>` : ''}</div></div><span class="tl-min">${evMinute(e)}</span></li>`;
}
function timelineHTML(m, st) {
  if (!st.events.length && st.k <= 0 && m.hlDown) return empty(hlDownMsg(m));
  if (!st.events.length && st.k <= 0) return empty(m.status === 'NS' ? `Kick-off is on ${fmtDayLong(m.ts)}${m.tbc ? ". The time hasn't been announced yet" : ' at ' + fmtTime(m.ts)}. Goals, cards and subs will appear here during the match.` : 'Nothing has happened yet.');
  let h = 0, a = 0, hh = 0, ha = 0;
  const after = new Map();
  st.events.forEach(e => {
    if (!e.scoreSide) return;
    e.scoreSide === 'home' ? h++ : a++;
    if (e.key < 4599) { hh = h; ha = a; }
    after.set(e, `${h}–${a}`);
  });
  const mark = t => `<li class="tl-mark"><span>${t}</span></li>`;
  const items = [{ key: -1, html: mark('Kick-off') }];
  const allGoals = h === st.score.home && a === st.score.away; // false when some goals have no event (no Highlightly data)
  const htTxt = allGoals ? `${hh}–${ha}` : m.htGoals ? `${m.htGoals.home}–${m.htGoals.away}` : '';
  if (st.k >= 4599) items.push({ key: 4599.5, html: mark(htTxt ? `Half-time · ${htTxt}` : 'Half-time') });
  if (st.isFT) items.push({ key: 1e9, html: mark(`Full time · ${st.score.home}–${st.score.away}`) });
  st.events.forEach((e, i) => items.push({ key: e.key + i * 1e-4, html: tlRow(m, e, after.get(e)) }));
  items.sort((x, y) => y.key - x.key); // newest first, like a live feed
  return `${m.hlDown ? `<p class="help tl-note">${hlDownMsg(m)}</p>` : ''}<ol class="tl">${items.map(x => x.html).join('')}</ol>`;
}

  const near = data.shots.filter(s => s.min != null && Math.abs(s.min * 100 + s.extra - e.key) <= 150);

  const sit = e.type === 'own' ? 'Own goal' : e.type === 'pen' || /penalty/.test(t) ? 'Penalty' : /following a corner/.test(t) ? 'From a corner' : /free kick/.test(t) ? 'Free kick' : /fast break/.test(t) ? 'Counter-attack' : /set piece/.test(t) ? 'Set piece' : 'Open play';

  const h = !place ? '' : /top|high/.test(place) ? 'High' : /bottom|low/.test(place) ? 'Low' : 'Middle';

/* ---------- Profiles and the fan chat ----------
   Firestore: profiles/<account> = { displayName, username }, usernames/<name> = { uid } (one person per

   The database rules check that people only post as themselves and can't take someone else's username. */
const Prof = { me: null, loaded: false };
const GUEST_RX = /^guest[0-9]+$/;
// Every account gets a member record: "Guest 4821" (@guest4821) until they choose a name
async function memberEnsure(u) {
  if (!u || !Acct.m || !Acct.db) return null;
  const { doc, getDoc, setDoc, runTransaction } = Acct.m, ref = doc(Acct.db, 'profiles', u.uid);
  try {
    const d = await getDoc(ref);
    if (d.exists()) { const p = d.data(); if (Date.now() - (p.lastSeen || 0) > 12 * 3600e3) setDoc(ref, { lastSeen: Date.now() }, { merge: true }).catch(() => {}); return p; }
    for (let i = 0; i < 6; i++) {
      const n = String(Math.floor((i < 3 ? 1000 : 100000) + Math.random() * (i < 3 ? 9000 : 900000))), un = 'guest' + n;
      const rec = { displayName: 'Guest ' + n, username: un, guest: true, createdAt: Date.now(), lastSeen: Date.now(), at: Date.now() };
      try {
        await runTransaction(Acct.db, async tx => { const r = doc(Acct.db, 'usernames', un), s = await tx.get(r); if (s.exists()) throw Object.assign(new Error('taken'), { code: 'taken' }); tx.set(r, { uid: u.uid }); tx.set(ref, rec); });
        return rec;
      } catch (e) { if (e.code !== 'taken') return null; }
    }

}
const UNAME_RX = /^[a-z0-9_.]{3,20}$/;
async function profLoad() {

// A profile made automatically from the sign-in name ("Ahmed Benali" -> @ahmedbenali). They can change it any time with Edit profile.
async function profAuto(u, old) {
  if (!u || u.isAnonymous || !Acct.m || !Acct.db) return null;
  let name = (u.displayName || (u.email || '').split('@')[0] || '').trim().replace(/\s+/g, ' ').slice(0, 30);
  if (name.length < 2 || hasSwear(name)) name = 'Culé fan';
  let base = name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, '').replace(/[^a-z0-9_.]/g, '').slice(0, 14);
  if (base.length < 3 || GUEST_RX.test(base) || hasSwear(base)) base = 'cule' + base;
  base = base.slice(0, 14);
  const { doc, runTransaction } = Acct.m, ref = doc(Acct.db, 'profiles', u.uid);
  for (let i = 0; i < 8; i++) {
    const un = i === 0 ? base : base + Math.floor((i < 4 ? 10 : 1000) + Math.random() * (i < 4 ? 90 : 9000));
    if (!UNAME_RX.test(un)) continue;
    const rec = { displayName: name, username: un, guest: false, createdAt: (old && old.createdAt) || Date.now(), lastSeen: Date.now(), at: Date.now() };
    try {
      await runTransaction(Acct.db, async tx => {
        const r = doc(Acct.db, 'usernames', un), sn = await tx.get(r);
        if (sn.exists() && sn.data().uid !== u.uid) throw Object.assign(new Error('taken'), { code: 'taken' });
        if (!sn.exists()) tx.set(r, { uid: u.uid });
        if (old && old.username && old.username !== un) tx.delete(doc(Acct.db, 'usernames', old.username));
        tx.set(ref, rec);

    } catch (e) { if (e.code !== 'taken') return null; }
  }

}

const SWEAR_IN = ['fuck', 'fuk', 'fck', 'phuck', 'phuk', 'fvck', 'shit', 'bitch', 'cunt', 'asshole', 'dickhead', 'bastard', 'whore', 'slut', 'nigger', 'nigga', 'faggot', 'retard', 'pussy', 'wanker', 'twat', 'motherf', 'bullshit',

const SWEAR_OK = /scunthorpe|shi+tak[ei]|dick advocaat|cockerill|hancock|peacock|arsenal|penistone|essex|sussex|middlesex|cockpit|cocktail|cocker/gi; // real words that contain a swear

  return swearVariants(t.replace(/[\s.\-_*•+]+/g, '')).some(v => { const w = v.replace(/[^\p{L}\p{N}]/gu, ''); return SW_IN.some(x => x.length >= 4 && w.includes(x)); });

/* ---------- Push notifications ----------
   Alerts that arrive even when the app is closed: lineups announced, kick-off, goals,
   half-time and full time. The free Cloudflare push server (push-worker.js) checks Barça's
   matches every minute and sends them; this part asks the phone for permission and tells
   the server which alerts this device wants. Each device chooses its own alerts. */
const PUSH_KINDS = [['goals', 'Goals'], ['kickoff', 'Kick-off'], ['halftime', 'Half-time'], ['fulltime', 'Full time'], ['lineups', 'Lineups announced']];
const Push = Object.assign({ on: false, prefs: {}, synced: 0, lang: '' }, store.get('push', {}));

function pushState() {
  if (/PWAShell/.test(navigator.userAgent)) return 'iosapp'; // inside the App Store app: iPhone apps can't use web alerts
  if (!/github\.io$/.test(location.hostname) || !('serviceWorker' in navigator)) return 'site'; // the service worker only runs on the app's website
  if (isIOS() && !isInstalled()) return 'ios'; // iPhones only allow alerts from apps added to the Home Screen
  if (!('PushManager' in window) || !('Notification' in window)) return 'unsupported';
  if (Notification.permission === 'denied') return 'blocked';
  return Push.on && Notification.permission === 'granted' ? 'on' : 'off';

const bytesB64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function pushPost(path, body) {
  const res = await fetch(PUSH_SERVER + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const json = await res.json().catch(() => ({}));
  if (!res.ok || json.ok === false) throw new Error(json.error || 'Push server error ' + res.status);
  return json;
}
// This phone's push address, made with the server's key (made again if the server's key changed)
async function pushSubscription() {
  const reg = await swReady();
  const { key } = await (await fetch(PUSH_SERVER + '/vapid')).json();
  let sub = await reg.pushManager.getSubscription();
  if (sub) {
    const cur = sub.options && sub.options.applicationServerKey;
    if (cur && bytesB64u(cur) === key) return sub;
    await sub.unsubscribe();
  }

    const perm = await Notification.requestPermission(); // must come first: iPhones only ask straight after a tap
    if (perm !== 'granted') { toast(perm === 'denied' ? 'Notifications are blocked for Culé Live.' : 'Notifications are still off.'); return; }
    await pushSend(await pushSubscription());
    Object.assign(Push, { on: true, synced: Date.now(), lang: LANG }); pushSave();
    toast('Notifications are on');
  } catch (e) { console.warn('Push:', e); toast("Couldn't turn on notifications. Check your internet connection and try again."); }

}
async function pushDisable() {
  try {
    const sub = await (await swReady()).pushManager.getSubscription();
    if (sub) { await pushPost('/unsubscribe', { endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); }
  } catch (e) { /* turned off on this phone anyway */ }

}

}
async function pushTest() {

function imgShrink(file, max, q, limit) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      let w = im.width, h = im.height, s = Math.min(1, max / Math.max(w, h)), out;
      for (let k = 0; k < 6; k++) {
        const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); out = c.toDataURL('image/jpeg', q);
        if (out.length < limit) break; s *= 0.8; q = Math.max(0.5, q - 0.08);
      }
      URL.revokeObjectURL(url); res(out);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); }; im.src = url;
  });
}

}

    case 'purge': { const n = Math.max(1, Math.min(50, +arg || 5)), ms = (Chat.msgs || []).slice(-n); let k = 0;
      for (const m of ms) { try { await Acct.m.deleteDoc(Acct.m.doc(Acct.db, 'chat', m.id)); k++; } catch (e) {} }
      botSay(`🧹 Deleted ${k} message${k === 1 ? '' : 's'}.`); return; }

    case 'mute': case 'unmute': case 'ban': case 'unban': {

      const { doc, setDoc, deleteDoc } = Acct.m, name = u.replace(/^@/, '');

}

/* Weekly champion (Mon–Sun, most prediction points) */
function wkKey(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
const Champ = { uid: null, name: '', pts: 0, wk: '', loaded: false };
async function weeklySync() {
  const me = await fanMe(); if (!me || !state.fixtures) return;
  const k0 = wkKey(Date.now()), k1 = wkKey(Date.now() - 7 * 864e5); let w0 = 0, w1 = 0;
  state.fixtures.forEach(f => { const p = getPred(f); if (!p) return; const x = predPoints(p, f); if (!x) return; const k = wkKey(f.ts); if (k === k0) w0 += x; else if (k === k1) w1 += x; });
  if (me.w0k === k0 && me.w0 === w0 && me.w1k === k1 && me.w1 === w1) return;
  try { await fanSave({ w0k: k0, w0, w1k: k1, w1 }); } catch (e) {}
}
async function champLoad() {
  if (Champ.loaded || !Acct.db) return Champ;
  Champ.loaded = true; const k1 = wkKey(Date.now() - 7 * 864e5); Champ.wk = k1;
  try { const { collection, query, orderBy, limit, getDocs } = Acct.m; const sn = await getDocs(query(collection(Acct.db, 'fan'), orderBy('w1', 'desc'), limit(25)));
    let best = null; sn.forEach(d => { const x = d.data(); if (x.w1k === k1 && x.w1 > 0 && !best) best = { uid: d.id, pts: x.w1 }; });
    if (best) { Champ.uid = best.uid; Champ.pts = best.pts; try { Champ.name = (await Acct.m.getDoc(Acct.m.doc(Acct.db, 'profiles', best.uid))).data()?.displayName || 'A Culé'; } catch (e) {} }
  } catch (e) {}
  return Champ;
}

const WORDS = ['PEDRI', 'YAMAL', 'GAVI', 'OLMO', 'KOUNDE', 'CUBARSI', 'MESSI', 'XAVI', 'INIESTA', 'PUYOL', 'NEYMAR', 'SUAREZ', 'BUSQUETS', 'PIQUE', 'ALBA', 'HENRY', 'RIVALDO', 'KOEMAN', 'CRUYFF', 'LAUDRUP', 'RAPHINHA', 'FERMIN', 'VALDES', 'ABIDAL', 'ALVES', 'DECO', 'RONALDO', 'KUBALA', 'GUARDIOLA', 'STOICHKOV'];
const wdWord = () => WORDS[(daySeed() * 7) % WORDS.length];
function wdScore(g, a) {
  const res = Array(g.length).fill('x'), left = {};
  [...a].forEach((ch, i) => { if (g[i] === ch) res[i] = 'g'; else left[ch] = (left[ch] || 0) + 1; });
  [...g].forEach((ch, i) => { if (res[i] !== 'g' && left[ch]) { res[i] = 'y'; left[ch]--; } });
  return res;
}
function wordleHTML() {
  const a = wdWord(), st = store.get('wd:' + dayKey(), { g: [] }), won = st.g.includes(a), lost = !won && st.g.length >= 6;
  const rows = [...st.g, ...Array(Math.max(0, 6 - st.g.length)).fill('')].map(g => `<div class="wd-row">${[...Array(a.length)].map((_, i) => { const r = g ? wdScore(g, a)[i] : ''; return `<span class="wd-c ${r}">${g ? g[i] : ''}</span>`; }).join('')}</div>`).join('');
  return `<section class="card game" id="wordle"><small class="nw-tag">BARÇA WORDLE</small><b class="ap-q">Guess today's Barça player (${a.length} letters)</b>

    <div class="wd-grid">${rows}</div>
    ${won ? `<p class="help">🎉 Got it in ${st.g.length}! +10 XP. New player tomorrow.</p>` : lost ? `<p class="help">It was <b>${a}</b>. New player tomorrow.</p>`
      : `<form id="wd-form" class="chat-form"><input id="wd-in" maxlength="${a.length}" autocomplete="off" autocapitalize="characters" placeholder="${a.length} letters"><button class="btn btn-primary" type="submit">Guess</button></form>`}</section>`;
}

  const a = wdWord(), inp = $('#wd-in'), g = (inp.value || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (g.length !== a.length) { toast(`Needs ${a.length} letters`); return; }
  const k = 'wd:' + dayKey(), st = store.get(k, { g: [] }); if (st.g.length >= 6 || st.g.includes(a)) return;

/* Guess the player */
async function gpPlayer() {
  if (!state.squadList || !state.squadList.length) { try { state.squadList = await Data.squad(); if (settings.mode === 'real' && settings.server) photosFor({ ...BARCA }, state.squadList, true); } catch (e) { state.squadList = []; } }
  const l = (state.squadList || []).filter(p => p.name); if (l.length < 4) return null;
  const n = daySeed(), ans = l[(n * 13) % l.length], others = l.filter(p => p !== ans), opts = [ans];
  for (let i = 0; opts.length < 4 && i < 50; i++) { const o = others[(n * 7 + i * 5) % others.length]; if (!opts.includes(o)) opts.push(o); }
  const sh = opts.map((p, i) => [p, (i * 37 + n) % 11]).sort((x, y) => x[1] - y[1]).map(x => x[0]);
  return { ans, opts: sh };
}

  const [a1, b1, a2, b2] = await Promise.all([getDocs(query(fr, where('a', '==', u.uid))), getDocs(query(fr, where('b', '==', u.uid))), getDocs(query(du, where('a', '==', u.uid))), getDocs(query(du, where('b', '==', u.uid)))]);

/* ---------- 8. Buttons, router and start-up ---------- */
const VIEWS = { home: viewHome, matches: viewMatches, table: viewTable, squad: viewSquad, options: viewOptions, dev: viewSetup, match: viewMatch, xi: viewXI, chat: viewChat, news: viewNews, games: viewGames, search: viewSearch, members: viewMembers, leagues: viewLeagues, feedback: viewFeedback };
const NAV = [['home', 'Home'], ['matches', 'Matches'], ['table', 'Table'], ['squad', 'Squad'], ['news', 'News'], ['games', 'Games'], ['chat', 'Chat'], ['options', 'Settings']];
const HIDDEN = { dev: 'dev', setup: 'options', xi: 'xi', members: 'members', leagues: 'leagues', feedback: 'feedback', search: 'search' }; // #dev = developer page, old #setup links go to Settings
function route() {
  const h = location.hash.slice(1);
  if (h.startsWith('match-')) return { name: 'match', id: h.slice(6) };
  if (HIDDEN[h]) return { name: HIDDEN[h] };
  return { name: NAV.some(([k]) => k === h) ? h : 'home' };
}
const routeKey = r => r.name + (r.id ? ':' + r.id : '');

let renderSeq = 0;
async function render() {
  const seq = ++renderSeq, r = route(), view = $('#view');
  if (Acct.user && !Acct.user.isAnonymous && !Fan.ticked) { Fan.ticked = true; setTimeout(loginTick, 1500); }
  if (r.name !== 'chat') { if (Chat.unsub) { Chat.unsub(); Chat.unsub = null; } if (r.name !== 'options' && r.name !== 'members') chatStop(); } // only listen while the chat (or the admin list) is open
  if (!['match', 'xi', 'members', 'leagues', 'feedback'].includes(r.name)) state.lastTab = r.name;
  document.querySelectorAll('.tab').forEach(t => { if (t.dataset.tab === (r.name === 'match' ? state.lastTab : r.name === 'xi' ? 'squad' : ['members', 'feedback'].includes(r.name) ? 'options' : r.name === 'leagues' ? 'home' : r.name)) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
  const sameView = view.dataset.route === routeKey(r);
  if (!sameView) { closeSheet(false); view.innerHTML = '<div class="loading">Loading…</div>'; window.scrollTo(0, 0); }
  let html;
  try { html = await VIEWS[r.name](r); }
  catch (e) { html = errorHTML(e); }
  if (seq !== renderSeq) return;
  view.innerHTML = html; view.dataset.route = routeKey(r);
  if (r.name === 'match' && state.sheetPid && !/^(season|goal|xi):/.test(String(state.sheetPid))) Data.match(r.id).then(m => { const c = $('#sheet-content'); if (c) c.innerHTML = sheetBodyHTML(m, mcStateOf(m), state.sheetPid); }).catch(() => {});
}
function errorHTML(e) {
  const msg = e instanceof AppError ? e.message : 'Something went wrong while loading. Please try again.';
  if (!(e instanceof AppError)) console.warn(e);
  return `<div class="errbox" role="alert"><b>Couldn't load this</b><p>${esc(msg)}</p><div class="row"><button class="btn btn-ghost" data-act="retry">Try again</button>${settings.mode === 'api' ? '<button class="btn btn-ghost" data-act="dev-reset">Back to normal</button>' : ''}</div></div>`;
}

// Called every time the clock moves: only the parts that change are redrawn
function onClockChange(fresh) {
  const r = route(), goal = fresh.some(e => e.scoreSide);
  if (r.name === 'home' && Clock.m === DEMO_LIVE) {
    const dyn = $('#lc-dyn'); if (dyn) dyn.innerHTML = lcDynHTML(DEMO_LIVE, Clock.state(), 'demo', goal);
    const snap = $('#table-snap'); if (snap) snap.innerHTML = tableSnapHTML(demoTable());
  } else if (r.name === 'match' && Clock.m && String(Clock.m.id) === r.id) {
    const st = Clock.state();
    const head = $('#mc-head'); if (head) head.innerHTML = mcHeadInner(Clock.m, st, true, goal);
    const panel = $('#mc-panel'); if (panel && state.mcTab !== 'h2h') panel.innerHTML = panelHTML(Clock.m, st, true);
    const sheet = $('#sheet-content'); if (sheet && state.sheetPid) sheet.innerHTML = sheetBodyHTML(Clock.m, st, state.sheetPid);
  } else if (r.name === 'matches' && Clock.m === DEMO_LIVE) {
    const row = $('#live-row'); if (row) row.outerHTML = fxRowHTML(DEMO_LIVE);
  } else if (r.name === 'table' && Clock.m === DEMO_LIVE && state.tableComp !== 'CL') {
    const body = $('#table-body'); if (body) body.innerHTML = demoTable().rows.map(x => tableRowHTML(x, false)).join('');
  }

}
function syncControls() {
  document.querySelectorAll('[data-act="clock-toggle"]').forEach(b => { b.innerHTML = Clock.playing ? I.pause : I.play; b.setAttribute('aria-label', Clock.playing ? 'Pause' : 'Play'); });

async function startReplay(id) {

// API mode: refresh live matches every few seconds (only while the page is visible)
let pollTimer;
function schedulePoll() {
  clearInterval(pollTimer);
  if (settings.mode !== 'api' && !(settings.mode === 'real' && settings.server)) return;
  pollTimer = setInterval(async () => {
    if (document.hidden || !state.fixtures || ['dev', 'options'].includes(route().name)) return;
    const live = state.fixtures.find(isLiveF);
    const soon = state.fixtures.find(f => f.status === 'NS' && f.ts - Date.now() < 15 * 60e3 && f.ts - Date.now() > -3 * 3600e3);
    if (!live && !soon) return;
    try { await Data.fixtures(true); if (live) await Data.match(live.id, true); render(); } catch (e) { /* try again next time */ }
  }, (settings.mode === 'real' ? Math.max(30, settings.refresh) : settings.refresh) * 1000);
}

    case 'mvp': mvpVote(b.dataset.id, b.dataset.n); break;
    case 'wrapped': wrappedShare(); break;
    case 'fotw': fotwSet(Fotw.uid === b.dataset.uid ? null : b.dataset.uid, '').then(ok => { if (ok) fanOpen(b.dataset.uid); }); break;
    case 'pxi': pxiToggle(b.dataset.id); break;
    case 'pxi-save': pxiSave(); break;
    case 'ap-vote': apVote(b.dataset.id, b.dataset.i); break;
    case 'ap-close': apClose(b.dataset.id); break;
    case 'ap-del': apDel(b.dataset.id, b); break;
    case 'post-open': postOpen(b.dataset.id); break;
    case 'post-del': postDelete(b.dataset.id, b); break;
    case 'theme': store.set('theme', b.dataset.t); themeApply(); document.querySelectorAll('[data-act="theme"]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.t === b.dataset.t))); break;
    case 'lg-join-pending': { const c = store.get('pendingJoin', ''); store.set('pendingJoin', ''); const fake = { querySelector: () => b }; const inp = $('#lg-code'); if (inp) { inp.value = c; lgJoin(fake); } break; }
    case 'fb-kind': Fb.kind = b.dataset.k; document.querySelectorAll('[data-act="fb-kind"]').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.k === Fb.kind))); break;
    case 'fb-send': fbSend(b); break;
    case 'fb-del': fbDelete(b.dataset.id); break;
    case 'rep-dismiss': Acct.m.deleteDoc(Acct.m.doc(Acct.db, 'reports', b.dataset.id)).then(() => { $('#rep-' + CSS.escape(b.dataset.id))?.remove(); toast('Dismissed'); }).catch(() => toast("Couldn't do that.")); break;
    case 'rep-delmsg': Promise.all([Acct.m.deleteDoc(Acct.m.doc(Acct.db, 'chat', b.dataset.msg)).catch(() => {}), Acct.m.deleteDoc(Acct.m.doc(Acct.db, 'reports', b.dataset.id))]).then(() => { $('#rep-' + CSS.escape(b.dataset.id))?.remove(); toast('Message deleted'); }); break;
    case 'lg-open': lgOpen(b.dataset.code, b); break;
    case 'lg-share': lgShare(b.dataset.code); break;
    case 'lg-leave': lgLeave(b.dataset.code, b); break;
    case 'refresh-data': store.clear('cache:'); state.fixtures = null; state.cache = {}; toast('Match data refreshed'); $('#view').dataset.route = ''; render(); break;
    case 'retry': $('#view').dataset.route = ''; render(); break;
  }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'acct-form') { e.preventDefault(); acctEmail(e.target); }
  if (e.target.id === 'prof-form') { e.preventDefault(); profSave(e.target); }
  if (e.target.id === 'mem-form') { e.preventDefault(); memSave(e.target); }
  if (e.target.id === 'del-form') { e.preventDefault(); acctDelete(e.target); }
  if (e.target.id === 'lg-create') { e.preventDefault(); lgCreate(e.target); }
  if (e.target.id === 'lg-join') { e.preventDefault(); lgJoin(e.target); }
  if (e.target.id === 'lgc-form') { e.preventDefault(); lgChatSend(e.target); }
  if (e.target.id === 'post-form') { e.preventDefault(); postPublish(e.target); }
  if (e.target.id === 'ap-form') { e.preventDefault(); apSubmit(e.target); }
  if (e.target.id === 'fan-form') { e.preventDefault(); fanSubmit(); }
  if (e.target.id === 'wd-form') { e.preventDefault(); wdGuess(); }
  if (e.target.id === 'fr-form') { e.preventDefault(); frAdd($('#fr-in').value); }
  if (e.target.id === 'chat-form') { e.preventDefault(); chatSend(e.target); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'season') { devChange(); settings.season = +t.value; saveSettings(); state.fixtures = null; if (Clock.mode === 'replay') Clock.unload(); updateModeChip(); }
  if (t.id === 'refresh') { devChange(); settings.refresh = +t.value; saveSettings(); schedulePoll(); }
  if (t.id === 'alerts') { settings.alerts = t.checked; saveSettings(); }
  if (t.id === 'xi-form' && XI_SHAPES[t.value] && t.value !== XI.f) { XI.f = t.value; xiSave(); xiRedraw(); }
  if (t.dataset.push) { Push.prefs[t.dataset.push] = t.checked; pushPrefs(); }
  if (t.id === 'scrub') state.scrubbing = false;
});
document.addEventListener('change', async e => { if (e.target.id === 'pf-imgs') postPick(e.target);
  if (e.target.id === 'ff-pic' && e.target.files[0]) { try { Fan.draft.pic = await imgShrink(e.target.files[0], 256, 0.8, 60000); $('#ff-prev').innerHTML = avatarHTML('', '', { ...Fan.draft }, 'big'); } catch (err) { toast("Couldn't use that picture."); } } });
document.addEventListener('input', e => { if (e.target.id === 'sr-in') { clearTimeout(srTimer); const v = e.target.value; srTimer = setTimeout(() => searchRun(v), 250); return; } if (e.target.id === 'mem-search') { Mem.q = e.target.value; memPaint(); return; } if (e.target.id === 'mem-user') { e.target.value = e.target.value.toLowerCase().replace(/\s+/g, ''); return; } if (e.target.id === 'prof-user') { unameCheck(e.target); return; } if (e.target.id === 'xi-search') { const r = $('#xi-results'); if (r) r.innerHTML = xiPickerList(e.target.value); return; } if (e.target.id === 'scrub') { state.scrubbing = true; Clock.seek(+e.target.value); } });
document.addEventListener('pointerup', () => { state.scrubbing = false; });
window.addEventListener('hashchange', render);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
setInterval(() => document.querySelectorAll('[data-count]').forEach(el => { el.textContent = countdown(+el.dataset.count); }), 30000);
setInterval(() => {
  document.querySelectorAll('[data-clock]').forEach(el => { const t = clockText(el.dataset.clock); if (t) el.textContent = t; });
  document.querySelectorAll('[data-ago]').forEach(el => { el.textContent = agoText(); });
}, 1000);

// When the API-Football plan is upgraded from Free, switch to this season's live data by itself
async function checkPlan() {
  const server = (settings.server || '').trim().replace(/\/+$/, '');
  if (!server || settings.picked || settings.mode === 'api') return;
  if (Date.now() - store.get('planCheck', 0) < 3600e3) return; // check at most once an hour
  try {
    const res = await fetch(server + '/status');
    const json = await res.json();
    const r = Array.isArray(json.response) ? json.response[0] : json.response;
    store.set('planCheck', Date.now());
    const plan = r?.subscription?.plan;
    if (plan && plan !== 'Free') { settings.mode = 'api'; settings.season = 2026; saveSettings(); resetApp(); toast('Live data for this season is now on'); }
  } catch (e) { /* not reachable here: keep the built-in data */ }
}
(function init() {
  startTranslating();
  if ('serviceWorker' in navigator && /github\.io$/.test(location.hostname)) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* works without it, just not offline */ });
    navigator.serviceWorker.addEventListener('message', e => { if (e.data && typeof e.data.open === 'string') location.hash = e.data.open; }); // a tapped alert opens its match
    pushSync();
  }
  acctStart(); acctButton();
  $('#tabbar').innerHTML = NAV.map(([k, label]) => `<a class="tab" href="#${k}" data-tab="${k}">${I[k]}<span>${label}</span></a>`).join('');
  updateModeChip();
  if (settings.mode === 'demo') startDemo();
  if (settings.mode === 'real') { SR.connect(); setTimeout(loadCrests, 1500); }
  schedulePoll();
  render();
  checkPlan();
})();
