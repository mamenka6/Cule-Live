<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F3C8F">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Culé Live">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Culé Live</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Unofficial Barça fan app: live scores, lineups, stats and player ratings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&family=Cairo:wght@500;600;700;800&display=swap">
<style>
/* Layout: one phone-width column, sticky top bar, fixed bottom tabs.
   The live scoreboard in shirt stripes is the one loud element; everything else stays quiet. */
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --surface-2:#F4F6FA; --ink:#0B1530; --muted:#5A6482; --line:#DCE1EB;
  --blau:#0D3B8C; --grana:#A3123F; --gold:#E9B300;
  --stripe-a:#0F3C8F; --stripe-b:#9E1340; --on-stripe:#FFFFFF; --on-accent:#FFFFFF;
  --tint-blau:rgba(13,59,140,.08); --tint-grana:rgba(163,18,63,.07);
  --win:#1E8A56; --draw:#7F88A0; --loss:#C5344A; --on-sem:#FFFFFF;
  --r-elite:#1556B8; --r-good:#1E8A56; --r-ok:#CF8410; --r-poor:#C5344A;
  --opp:#8790A8; --z-uel:#D9730D; --z-uecl:#1E8A56;
  --pitch-a:#2D7A4D; --pitch-b:#297248; --pitch-line:rgba(255,255,255,.45);
  --card-y:#F2C200; --card-r:#D7263D; --ball-bg:#FFFFFF; --ball-line:#16203A;
  --shadow:0 1px 2px rgba(11,21,48,.06), 0 6px 18px rgba(11,21,48,.07);
  --f-display:"Big Shoulders Display","Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070C1A; --surface:#0F172C; --surface-2:#162039; --ink:#ECF0F9; --muted:#97A1BE; --line:#232E4D;
    --blau:#5B8CF5; --grana:#E2507D; --gold:#F2C833;
    --stripe-a:#123E93; --stripe-b:#8A1239; --on-stripe:#FFFFFF; --on-accent:#08101F;
    --tint-blau:rgba(91,140,245,.14); --tint-grana:rgba(226,80,125,.12);
    --win:#3DBB7C; --draw:#8E98B4; --loss:#EF5A6E; --on-sem:#06101C;
    --r-elite:#6FA0FF; --r-good:#3DBB7C; --r-ok:#F2A93B; --r-poor:#EF5A6E;
    --opp:#7D88A6; --z-uel:#F2913B; --z-uecl:#3DBB7C;
    --pitch-a:#1B4A33; --pitch-b:#18432E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070C1A; --surface:#0F172C; --surface-2:#162039; --ink:#ECF0F9; --muted:#97A1BE; --line:#232E4D;
  --blau:#5B8CF5; --grana:#E2507D; --gold:#F2C833;
  --stripe-a:#123E93; --stripe-b:#8A1239; --on-stripe:#FFFFFF; --on-accent:#08101F;
  --tint-blau:rgba(91,140,245,.14); --tint-grana:rgba(226,80,125,.12);
  --win:#3DBB7C; --draw:#8E98B4; --loss:#EF5A6E; --on-sem:#06101C;
  --r-elite:#6FA0FF; --r-good:#3DBB7C; --r-ok:#F2A93B; --r-poor:#EF5A6E;
  --opp:#7D88A6; --z-uel:#F2913B; --z-uecl:#3DBB7C;
  --pitch-a:#1B4A33; --pitch-b:#18432E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
[hidden]{display:none!important}
img{max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--blau);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}

/* ---------- App shell ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in{max-width:540px;margin:0 auto;height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;border-radius:7px;background:repeating-linear-gradient(90deg,var(--stripe-a) 0 5.2px,var(--stripe-b) 5.2px 10.4px);box-shadow:inset 0 -4px 0 var(--gold)}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.mode-chip{font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap}
.mode-chip.api{color:var(--blau);border-color:var(--blau)}
.main{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar-in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-family:var(--f-label);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab span{max-width:100%;padding:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
:root:not([lang="en"]) .tab{letter-spacing:.02em;font-size:11.5px}
.tab[aria-current="page"]{color:var(--blau)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--blau)}

/* ---------- Shared pieces ---------- */
.page-title{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.page-sub{color:var(--muted);font-size:14px;margin-top:6px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-title{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sec-link{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--blau)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.note,.help{font-size:13px;color:var(--muted);line-height:1.45}
.note{margin-top:8px}
.help a{color:var(--blau);text-decoration:underline}
.empty{padding:22px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;font-size:14px}
.loading{padding:40px 0;text-align:center;color:var(--muted);font-family:var(--f-label);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.errbox{padding:16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--loss);border-radius:12px;display:flex;flex-direction:column;gap:8px}
.errbox p{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}

.badge{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;flex:none;font-family:var(--f-label);font-weight:700;font-size:14px;letter-spacing:.03em;color:#fff;background:hsl(var(--h,220) 30% 38%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.22);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.badge.crest{background:none;box-shadow:none;border-radius:0}
.badge.crest img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.badge.crest .bt{display:none}
.badge-fcb{background:repeating-linear-gradient(90deg,var(--stripe-a) 0 7.3px,var(--stripe-b) 7.3px 14.6px)}
.badge.sm{width:26px;height:26px;font-size:10px}
.badge.lg{width:56px;height:56px;font-size:16px}
.badge.sm.badge-fcb{background:repeating-linear-gradient(90deg,var(--stripe-a) 0 4.3px,var(--stripe-b) 4.3px 8.6px)}

.tag{display:inline-block;font-family:var(--f-label);font-weight:700;font-size:11px;letter-spacing:.06em;padding:1px 6px;border-radius:5px;background:var(--tint-blau);color:var(--blau);line-height:1.5}
.tag.c-ucl{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.tag.c-cdr{background:var(--tint-grana);color:var(--grana)}
.tag.c-oth{background:var(--surface-2);color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:10px;font-family:var(--f-label);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--blau);color:var(--on-accent)}
.btn-ghost{background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.btn-light{background:var(--on-stripe);color:var(--stripe-a)}
.btn-sm{height:34px;padding:0 12px;font-size:14px}
.btn.wide{width:100%}
.link-btn{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--blau)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.seg button{height:36px;border-radius:9px;font-family:var(--f-label);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.06em;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);text-transform:uppercase;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.live{background:var(--grana);color:var(--on-stripe)}
.pill.sm{font-size:12px;padding:2px 8px}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.4s ease-in-out infinite;flex:none}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--grana);margin-left:6px;animation:pulse 1.4s ease-in-out infinite;vertical-align:1px}

.rt{display:inline-grid;place-items:center;min-width:34px;height:24px;padding:0 6px;border-radius:7px;font-family:var(--f-label);font-weight:700;font-size:14px;color:var(--on-sem);font-variant-numeric:tabular-nums}
.r-elite{background:var(--r-elite)} .r-good{background:var(--r-good)} .r-ok{background:var(--r-ok)} .r-poor{background:var(--r-poor)}
.rt.big{min-width:58px;height:42px;font-size:24px;border-radius:10px}

.ico{width:20px;height:20px;flex:none}
.b-bg{fill:var(--ball-bg);stroke:var(--ball-line);stroke-width:1.5}
.b-ln{fill:var(--ball-line)}
.b-st{fill:none;stroke:var(--ball-line);stroke-width:1.3}
.x-ln{fill:none;stroke:var(--loss);stroke-width:2.6;stroke-linecap:round}
.f-win{fill:var(--win)} .f-loss{fill:var(--loss)}
.cd{display:inline-block;width:12px;height:16px;border-radius:2px;flex:none;margin:2px 4px}
.cd.y{background:var(--card-y)} .cd.r{background:var(--card-r)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);z-index:40;width:min(92vw,480px);background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;font-size:14px;animation:drop .35s ease}
.toast b{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.02em;text-transform:uppercase}
.toast.goal{border-left:8px solid var(--gold)}

/* ---------- Home: live card (the loud part) ---------- */
.livecard{position:relative;border-radius:18px;overflow:hidden;color:var(--on-stripe);padding:16px 16px 14px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);
  background:linear-gradient(180deg,rgba(4,8,24,.2) 0%,rgba(4,8,24,.62) 100%),repeating-linear-gradient(90deg,var(--stripe-a) 0 36px,var(--stripe-b) 36px 72px)}
#lc-dyn{display:flex;flex-direction:column;gap:14px}
.live-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-label);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.live-top>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.38);padding:4px 10px;border-radius:99px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.live-pill .dot{background:var(--gold)}
.live-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.lt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:600;font-size:15px;min-width:0}
.nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ls{display:flex;gap:10px;font-family:var(--f-display);font-weight:800;font-size:66px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.sep{opacity:.55}
.live-last{display:flex;align-items:center;gap:8px;font-size:14px;background:rgba(0,0,0,.3);border-radius:10px;padding:8px 12px;min-height:38px}
.live-last b{font-family:var(--f-label);font-weight:700;font-variant-numeric:tabular-nums}
.live-last .cd{margin:0 2px}
.live-last .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{position:relative;height:6px;border-radius:6px;background:rgba(255,255,255,.22);margin:4px 0}
.bar-fill{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--gold)}
.bar-ht{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.6)}
.bar-mark{position:absolute;top:50%;transform:translate(-50%,-50%);width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.bar-mark.y{width:7px;height:10px;border-radius:2px;background:var(--card-y);box-shadow:none}
.bar-mark.r{width:7px;height:10px;border-radius:2px;background:var(--card-r);box-shadow:none}
.live-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.live-note{font-size:13px;opacity:.85}
.ctl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctl{width:40px;height:40px;border-radius:10px;display:inline-grid;place-items:center;background:rgba(255,255,255,.16)}
.ctl svg{width:20px;height:20px}
.speed{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:rgba(255,255,255,.16)}
.speed button{height:34px;min-width:40px;border-radius:8px;font-family:var(--f-label);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.speed button[aria-pressed="true"]{background:var(--on-stripe);color:var(--stripe-a)}
.flash{animation:flash .8s ease}

/* ---------- Home: next match, form ---------- */
.next{padding:16px;display:flex;flex-direction:column;gap:14px}
.next-meta{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.next-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.nt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:600;min-width:0}
.next-count{display:flex;flex-direction:column;align-items:center;gap:2px}
.next-count small{font-family:var(--f-label);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.next-count strong{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;color:var(--blau);font-variant-numeric:tabular-nums;white-space:nowrap}
.pred{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.pred-label{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pred-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;gap:6px}
.st-team{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.05em;color:var(--muted);min-width:30px;text-align:center}
.step{width:32px;height:32px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:18px;font-weight:600;line-height:1}
.stepper output{font-family:var(--f-display);font-weight:800;font-size:28px;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.pred-dash{font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--muted)}
.form{display:flex;gap:8px}
.fchip{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--on-sem)}
.W{background:var(--win)} .D{background:var(--draw)} .L{background:var(--loss)}
.latest{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;margin-top:10px}
.latest .meta{font-size:13px;color:var(--muted)}
.latest b{font-weight:600}
.latest .sc{font-family:var(--f-display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}

/* ---------- Matches ---------- */
.month{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:2px 0 8px}
.fxlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fx{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.fx:first-child{border-top:0}
.fx:hover{background:var(--surface-2)}
.fx.is-live{background:var(--tint-grana)}
.fx-date{display:flex;flex-direction:column;align-items:center;line-height:1;gap:3px}
.fx-date b{font-family:var(--f-display);font-weight:800;font-size:24px}
.fx-date small{font-family:var(--f-label);font-weight:600;font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.fx-mid{min-width:0;display:flex;flex-direction:column;gap:5px}
.fx-comp{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}
.fx-opp{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.fx-opp>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-end{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.fx-score{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1}
.fx-time{font-family:var(--f-label);font-weight:700;font-size:16px}
.res{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-label);font-weight:700;font-size:13px;color:var(--on-sem)}
.predpts{font-family:var(--f-label);font-weight:700;font-size:12px;color:var(--blau)}

/* ---------- Table ---------- */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tbl th{font-family:var(--f-label);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl th.club,.tbl td.club{text-align:left;width:100%}
.tbl td.rank,.tbl th.rank{text-align:center;width:36px;position:relative;font-weight:600}
.tbl td.rank::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:0 2px 2px 0;background:transparent}
.tbl tr.z-ucl td.rank::before{background:var(--blau)}
.tbl tr.z-uel td.rank::before{background:var(--z-uel)}
.tbl tr.z-uecl td.rank::before{background:var(--z-uecl)}
.tbl tr.z-rel td.rank::before{background:var(--loss)}
.tbl td.pts{font-weight:700}
.tbl tr.me td{background:var(--tint-blau)}
.tbl tr.me td.club{font-weight:700}
.club-in{display:flex;align-items:center;gap:8px}
.club-in .cn{min-width:0;overflow:hidden;text-overflow:ellipsis;max-width:min(32vw,200px)}
@media (max-width:440px){.tbl th,.tbl td{padding-left:5px;padding-right:5px}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* ---------- Squad ---------- */
.sq{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sq-row{border-top:1px solid var(--line)}
.sq-row:first-child{border-top:0}
.sq-row summary{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;list-style:none}
.sq-row summary::-webkit-details-marker{display:none}
.sq-row[open] summary{background:var(--surface-2)}
.sq-num{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--blau);text-align:center;font-variant-numeric:tabular-nums}
.sq-name{min-width:0}
.sq-name b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sq-name small{color:var(--muted);font-size:12.5px}
.sq-ga{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sq-btn{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 14px;width:100%;text-align:left;border-top:1px solid var(--line)}
.sq-btn:first-child{border-top:0}
.sq-btn:hover{background:var(--surface-2)}
.sq-detail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px 14px 14px 60px;background:var(--surface-2)}
.kv{display:flex;flex-direction:column}
.kv b{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.kv small{font-family:var(--f-label);font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:11px}

/* ---------- Match centre ---------- */
.back{display:inline-flex;align-items:center;gap:2px;font-family:var(--f-label);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--blau);align-self:flex-start;margin-bottom:-8px}
.back svg{width:18px;height:18px}
.mc-head{padding:14px 14px 12px;display:flex;flex-direction:column;gap:12px}
.mc-meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.mc-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px}
.mc-team{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:600;min-width:0}
.mc-mid{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:2px}
.mc-num{display:flex;gap:8px;font-family:var(--f-display);font-weight:800;font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.mc-ko{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1.1;color:var(--blau)}
.mc-pens{font-size:12px;color:var(--muted)}
.mc-scorers{display:grid;grid-template-columns:1fr 28px 1fr;gap:8px;font-size:12.5px;color:var(--muted);text-align:center}
.mc-scorers ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.mc-scorers .ico{width:16px;height:16px;justify-self:center;margin-top:1px}
.mc-sub{font-size:12.5px;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:10px}
.controls{display:flex;flex-direction:column;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.controls .ctl{background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.controls .speed{background:var(--surface-2);border:1px solid var(--line)}
.controls .speed button{color:var(--muted)}
.controls .speed button[aria-pressed="true"]{background:var(--blau);color:var(--on-accent)}
.ctl-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
#ctl-label{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
input[type="range"]{width:100%;accent-color:var(--blau);margin:0}

/* Timeline */
.tl{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column}
.tl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line);transform:translateX(-50%)}
.tl-row{display:grid;grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr);align-items:center;gap:6px;padding:7px 0;position:relative}
.tl-min{grid-column:2;grid-row:1;justify-self:center;z-index:1;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 8px;font-family:var(--f-label);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tl-ev{grid-row:1;display:flex;align-items:flex-start;gap:8px;min-width:0}
.tl-row.home .tl-ev{grid-column:1;flex-direction:row-reverse;text-align:right}
.tl-row.away .tl-ev{grid-column:3}
.tl-ev .txt{min-width:0}
.tl-ev b{display:block;font-weight:600;overflow-wrap:anywhere}
.tl-ev small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.tl-row.goal b{font-weight:700}
.tl-ev .sc{display:inline-block;margin-top:3px;font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.3;background:var(--ink);color:var(--bg);border-radius:6px;padding:0 6px;font-variant-numeric:tabular-nums}
.tl-mark{display:flex;justify-content:center;padding:10px 0;position:relative}
.tl-txt{display:block;min-width:0;text-align:inherit;cursor:pointer;border-radius:8px}
.tl-txt b::after{content:" ›";color:var(--muted);font-weight:600}
.tl-txt:hover b{color:var(--blau)}
.tl-note{margin:0 0 12px}
.gc-ico{background:var(--surface-2);border:1px solid var(--line)}
.gc-ico .ico{width:26px;height:26px}
.gc-score{display:flex;align-items:center;justify-content:center;gap:16px;padding:4px 0}
.gc-num{display:flex;gap:8px;font-family:var(--f-display);font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums;color:var(--muted)}
.gc-num .up{color:var(--ink)}
.gc-who{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;background:var(--surface-2);border-radius:12px}
.gc-who .sheet-name b{font-size:17px}
.gc-who .sheet-name small{display:block}
#gc-replay{display:flex;flex-direction:column;gap:10px}
.gc-loading{padding:18px 0}
.gc-replay{display:flex;flex-direction:column;gap:10px}
.gc-pitch,.gc-goal{display:block;width:100%;height:auto;border-radius:12px}
.gc-pitch .pa{fill:var(--pitch-a)} .gc-pitch .pb{fill:var(--pitch-b)}
.gc-pitch .ln2{fill:none;stroke:var(--pitch-line);stroke-width:.35}
.gc-goalbox{fill:rgba(255,255,255,.35);stroke:#fff;stroke-width:.3}
.gc-path{stroke:#fff;stroke-width:.45;stroke-dasharray:1.2 1}
.gc-us{fill:var(--stripe-a);stroke:var(--stripe-b);stroke-width:.7} .gc-them{fill:#F2F3F6;stroke:#14203F;stroke-width:.4}
.gc-numtxt{font-family:var(--f-label);font-weight:700;font-size:2.8px;text-anchor:middle} .gc-numtxt.on-us{fill:#fff} .gc-numtxt.on-them{fill:#14203F}
.gc-ballc{fill:#fff;stroke:#111;stroke-width:.3}
.gc-goal{background:var(--surface-2)}
.gc-net{stroke:var(--line);stroke-width:.3}
.gc-post{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.gc-ground{stroke:var(--muted);stroke-width:.6}
.gc-goaltxt{font-family:var(--f-display);font-weight:800;font-size:4.6px;fill:var(--ink);text-anchor:middle}
.gc-replay .ctl-foot .help{font-size:12px}
.tl-mark span{z-index:1;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}

/* Lineups */
.pitch{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:68/100;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(180deg,var(--pitch-a) 0 10%,var(--pitch-b) 10% 20%)}
.ln{position:absolute;border:2px solid var(--pitch-line);pointer-events:none}
.ln.outline{inset:3% 4%;border-radius:3px}
.ln.half{left:4%;right:4%;top:50%;height:0;border-width:2px 0 0}
.ln.circle{width:26%;aspect-ratio:1;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%}
.ln.box{left:22%;right:22%;height:14%}
.ln.six{left:37%;right:37%;height:5%}
.ln.top{top:3%;border-top:0}
.ln.bottom{bottom:3%;border-bottom:0}
.pitch-label{position:absolute;left:6%;font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.9);z-index:3;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.pitch-label.top{top:0.6%} .pitch-label.bottom{bottom:0.4%}
.pl{position:absolute;transform:translate(-50%,-50%);width:72px;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2}
.pl-dot{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-label);font-weight:700;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.t-fcb .pl-dot{background:repeating-linear-gradient(90deg,var(--stripe-a) 0 5.7px,var(--stripe-b) 5.7px 11.4px);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.t-opp .pl-dot{background:#F2F3F6;color:#14203F}
.pl .rt{position:absolute;top:-9px;left:24px;height:18px;min-width:28px;font-size:12px;border-radius:5px;padding:0 4px}
.pl-evs{position:absolute;bottom:-5px;right:24px;display:flex;gap:1px;align-items:center}
.pl-evs .ico{width:14px;height:14px}
.pl-evs .cd{width:8px;height:11px;margin:0 1px}
.pl-name{font-size:11.5px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.75);max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bench-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:14px}
.bench h3{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.bench ul{list-style:none;padding:0;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.bench li{border-top:1px solid var(--line)}
.brow{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:7px 10px;width:100%;text-align:left;font-size:14px}
button.rrow:hover,button.brow:hover{background:var(--surface-2)}
.bench li:first-child{border-top:0}
.bench li.unused{color:var(--muted)}
.bn{font-family:var(--f-label);font-weight:700;color:var(--muted);text-align:center}
.bnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bon{display:inline-flex;align-items:center;gap:2px;font-family:var(--f-label);font-weight:700;font-size:13px}
.bon .ico{width:14px;height:14px}

/* Stats */
.stats{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.st-head{display:flex;justify-content:space-between;font-family:var(--f-label);font-weight:700;letter-spacing:.06em;font-size:13px;color:var(--muted)}
.st-row{display:grid;grid-template-columns:58px minmax(0,1fr) 58px;align-items:center;gap:6px 8px}
.st-v{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1;font-variant-numeric:tabular-nums;color:var(--muted)}
.st-v.a{text-align:right}
.st-v.lead{color:var(--ink)}
.st-l{text-align:center;font-size:13px;color:var(--muted);font-weight:500}
.st-bars{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.st-bar{display:flex;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.st-bar.h{justify-content:flex-end}
.st-bar i{display:block;height:100%;border-radius:6px}
.fill-fcb{background:var(--blau)} .fill-opp{background:var(--opp)}

/* Ratings */
.potm{width:100%;text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.potm small{display:block;font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.potm b{display:block;font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.potm .meta{font-size:13px;color:var(--muted)}
.rgroup{margin-bottom:14px}
.rgroup h3{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.rlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.rlist li{border-top:1px solid var(--line)}
.rrow{display:grid;grid-template-columns:auto 26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;width:100%;text-align:left;font-size:14px}
.rlist li:first-child{border-top:0}
.rlist .nmw{min-width:0}
.rlist .nmw b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist .nmw small{color:var(--muted);font-size:12px}
.rlist .icons{display:flex;gap:2px;align-items:center}
.rlist .icons .ico{width:16px;height:16px}
.rlist .icons .cd{width:9px;height:12px;margin:0 1px}
.how{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.how summary{cursor:pointer;font-weight:600}
.how ul{margin:10px 0 0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* ---------- Setup ---------- */
.form-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.fc-title{font-family:var(--f-label);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.field{display:flex;gap:8px}
.field input,.form-card select{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:0 12px;font:inherit;min-width:0;flex:1}
.form-card select{flex:none;width:100%}
.inline-field{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:500}
.inline-field select{width:auto;min-width:110px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--blau)}
.about{font-size:13px;color:var(--muted);padding:0 4px}

/* Match centre extras: team averages, tabs, injuries, head-to-head */
.mc-tabs button{font-size:13px;letter-spacing:.03em}
.lu-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.lu-head>span{display:inline-flex;align-items:center;gap:8px;min-width:0;font-family:var(--f-label);font-weight:700;letter-spacing:.04em}
.tap-hint{text-align:center;margin-top:8px}
.demo-note{margin-top:12px}
.inj{margin-top:18px}
.inj>.sec-title{display:block;margin-bottom:8px}
.inj .bench-wrap{margin-top:0}
.injlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;font-size:14px}
.injlist b{display:block;font-weight:600}
.injlist small{color:var(--muted);font-size:12.5px}
.h2h-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:center;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;text-align:center}
.h2h-sum b{display:block;font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1}
.h2h-sum .w b{color:var(--blau)}
.h2h-sum small{font-family:var(--f-label);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.h2h-bar{grid-column:1/-1;display:flex;gap:2px;height:8px;border-radius:8px;overflow:hidden}
.h2h-bar i{display:block;height:100%}
.h2h-bar .d{background:var(--draw)}
.tbl .form-col{display:none}
@media (min-width:480px){.tbl .form-col{display:table-cell}}
.fm{display:inline-flex;gap:2px;vertical-align:middle}
.fm i{width:15px;height:15px;border-radius:3px;font-style:normal;font-family:var(--f-label);font-weight:700;font-size:10px;line-height:15px;text-align:center;color:var(--on-sem)}

.prob{display:flex;flex-direction:column;gap:6px}
.prob-bar{display:flex;gap:2px;height:8px;border-radius:8px;overflow:hidden}
.prob-bar i{display:block;height:100%}
.prob-bar .d{background:var(--draw)}
.prob-legend{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.real-note{margin:0}
.brow.sq2{grid-template-columns:36px minmax(0,1fr)}

.pos-ab{font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.04em}
.tsc{padding:0}
.tsc .tsc-n{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--blau);min-width:18px}
.tsc .tsc-g{font-family:var(--f-display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.tsc .tsc-g small{font-size:13px;color:var(--muted)}

.top-right{display:flex;align-items:center;gap:8px}
.acct-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font-family:var(--f-label);font-weight:700;font-size:15px;flex:none}
.acct-btn svg{width:18px;height:18px}
.acct-btn img,.acct-av img{width:100%;height:100%;object-fit:cover}
.btn-google{background:var(--surface);border:1px solid var(--line);color:var(--ink);text-transform:none;letter-spacing:0;font-family:var(--f-body);font-weight:600;font-size:15px;height:44px}
.acct-or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.acct-or::before,.acct-or::after{content:"";flex:1;height:1px;background:var(--line)}
.acct-form{display:flex;flex-direction:column;gap:6px}
.acct-form label{font-size:13px;font-weight:600;color:var(--muted);margin-top:4px}
.acct-form input{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:0 12px;font:inherit;width:100%}
.acct-form .btn{margin-top:8px;height:44px}
.acct-err{color:var(--loss);font-size:13.5px;min-height:0;margin:0}
.acct-err:empty{display:none}
.acct-links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.acct-me{display:flex;align-items:center;gap:12px}
.acct .sheet-sum{align-items:start}
.acct-av{width:48px;height:48px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--blau);color:var(--on-accent);font-family:var(--f-display);font-weight:800;font-size:22px;flex:none}
.acct-who{min-width:0;display:flex;flex-direction:column}
.acct-who b{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-who small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Player photos */
.pl-dot.has-ph{width:40px;height:40px;background:var(--surface-2)}
.t-fcb .pl-dot.has-ph{box-shadow:0 0 0 2px var(--stripe-a),0 0 0 4px var(--stripe-b),0 2px 6px rgba(0,0,0,.35)}
.t-opp .pl-dot.has-ph{box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.35)}
.pl-dot .ph,.sheet-num .ph{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:top}
.pl-dot.has-ph .pl-no,.sheet-num.has-ph .pl-no{display:none}
.pl-dot.has-ph .rt{left:28px}
.pl-nn{font-weight:700;opacity:.85}
.sheet-num{position:relative;overflow:hidden}
.sheet-num.has-ph{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--line)}
.av{display:inline-block;width:28px;height:28px;border-radius:50%;overflow:hidden;background:var(--surface-2);flex:none}
.av.sm{width:28px;height:28px}.av.md{width:44px;height:44px}
.av img{width:100%;height:100%;object-fit:cover;object-position:top}
.has-av{display:flex;align-items:center;gap:8px;min-width:0}
.bnt,.nmt,.sq-nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nmt b,.sq-nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nmt small,.sq-nm small{display:block}
.potm-who{display:flex;align-items:center;gap:10px;min-width:0}
/* Videos */
.vids{display:flex;flex-direction:column;gap:12px}
.vid{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vid-media{position:relative;display:block;width:100%;aspect-ratio:16/9;max-width:100%;background:#000}
.vid-media img{width:100%;height:100%;object-fit:cover;opacity:.92}
.vid-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.vid-play svg{width:28px;height:28px;margin-left:3px}
.vid-frame{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000}
.vid-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid-text{padding:12px 14px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.vid-text b{font-weight:600;line-height:1.3}
.vid-text small{color:var(--muted);font-size:12.5px}
.tl-vid{display:inline-flex;align-items:center;gap:4px;margin-top:4px;padding:2px 8px;border-radius:99px;background:var(--tint-blau);color:var(--blau);font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.tl-vid svg{width:12px;height:12px}
.mc-tabs{grid-auto-columns:minmax(58px,1fr);overflow-x:auto;scrollbar-width:none}
.mc-tabs button{padding:0 6px;white-space:nowrap}

/* Player card (slides up from the bottom) */
#sheet-root{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:rgba(4,8,24,.55);animation:fade .2s ease}
.sheet{position:relative;width:100%;max-width:540px;max-height:84vh;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:rise .25s ease}
#sheet-content{display:flex;flex-direction:column;gap:14px}
.sheet-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.sheet-num{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px}
.sheet-num.t-fcb{background:repeating-linear-gradient(90deg,var(--stripe-a) 0 8px,var(--stripe-b) 8px 16px);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.sheet-num.t-opp{background:var(--surface-2);border:1px solid var(--line)}
.sheet-name{min-width:0}
.sheet-name b{display:block;font-size:19px;font-weight:700;line-height:1.2}
.sheet-name small{color:var(--muted);font-size:13px}
.sheet-close{width:38px;height:38px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:22px;line-height:1}
.sheet-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:center;padding:12px;background:var(--surface-2);border-radius:12px}
.sheet-sum .kv{align-items:flex-start;gap:4px}
.sheet h3{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.kvlist{list-style:none;margin:0;padding:0}
.kvlist li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.kvlist li:first-child{border-top:0}
.kvlist b{font-weight:600;font-variant-numeric:tabular-nums}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
/* Arabic: its own font, no letter spacing (it breaks joined letters), mirrored arrows and bars */
:root[lang="ar"]{--f-display:"Cairo","Noto Sans Arabic",system-ui,sans-serif;--f-body:"Cairo","Noto Sans Arabic",system-ui,sans-serif;--f-label:"Cairo","Noto Sans Arabic",system-ui,sans-serif}
:root[lang="ar"] body *{letter-spacing:0!important}
[dir="rtl"] .back svg{transform:scaleX(-1)}
[dir="rtl"] .mc-scorers li{direction:ltr}
[dir="rtl"] .bar{transform:scaleX(-1)}
[dir="rtl"] .tbl td.rank::before{left:auto;right:0;border-radius:2px 0 0 2px}
[dir="rtl"] .sq-detail{padding:10px 60px 14px 14px}
[dir="rtl"] .toast.goal{border-left:0;border-right:8px solid var(--gold)}
.lang-seg button{text-transform:none;letter-spacing:0;font-family:var(--f-body);font-weight:600}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
@keyframes flash{0%{transform:scale(1)}25%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes drop{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:380px){.ls{font-size:56px}.mc-num{font-size:44px}.badge.lg{width:48px;height:48px;font-size:14px}.sq-detail{padding-left:14px}}
</style>

<script>
'use strict';
/* =====================================================================
   CULÉ LIVE: an unofficial Barça fan app (MYP Personal Project)

   How the code is organised:
   1. Helpers and saved settings
   2. Demo data (made up, so the app works without an API key)
   3. API-Football connection (real data)
   4. Data layer: demo and API data come out in the same shape
   5. Match engine: score, stats and player ratings at any minute
   6. Match clock: runs the live demo and match replays
   7. Screens (Home, Matches, Match centre, Table, Squad, Settings, hidden developer page)
   8. Buttons, router and start-up
   ===================================================================== */

/* ---------- 1. Helpers and saved settings ---------- */
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const other = side => side === 'home' ? 'away' : 'home';

// Everything saved stays in this browser only (localStorage).
const store = {
  get(k, d) { try { const v = localStorage.getItem('cule:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('cule:' + k, JSON.stringify(v)); } catch (e) { /* storage full or blocked */ } },
  clear(prefix) { try { Object.keys(localStorage).filter(k => k.startsWith('cule:' + prefix)).forEach(k => localStorage.removeItem(k)); } catch (e) {} }
};
// After you set up your free Cloudflare data server, paste its address here
// (for example 'https://cule-live.yourname.workers.dev') so everyone who opens the app gets real data.
const DATA_SERVER = 'https://cule-live.yellowlion2023.workers.dev';
// The push server (push-worker.js) sends notifications and keeps one shared copy of Highlightly's
// answers for every phone, so the 100-a-day Highlightly limit isn't used up by each phone separately.
const PUSH_SERVER = 'https://cule-push.yellowlion2023.workers.dev';
const HL_LIMIT = { at: 0 }; // when Highlightly last said its daily limit was used up
const settings = Object.assign({ mode: 'real', apiKey: '', server: DATA_SERVER, season: 2024, refresh: 15, alerts: true }, store.get('settings', {}));
if (DATA_SERVER && !settings.server) settings.server = DATA_SERVER;
const saveSettings = () => store.set('settings', settings);
if ((settings.v || 1) < 2) { settings.mode = 'real'; settings.v = 2; saveSettings(); } // switch older installs to real data
// Everyone gets the normal app. Data settings can only be changed on the hidden developer page (#dev),
// and any changes made there only last until "Back to normal" is pressed.
const DEFAULTS = { mode: 'real', server: DATA_SERVER, apiKey: '', picked: false, season: 2024, refresh: 15 };
if (!settings.dev) { Object.assign(settings, DEFAULTS); saveSettings(); }
const devChange = () => { settings.dev = true; };

const BARCA_ID = 529;  // FC Barcelona's team number in API-Football
const LALIGA_ID = 140; // La Liga's league number in API-Football

/* ---------- 3f. Languages ----------
   The app is written in English. In another language, every piece of text on screen is looked
   up in the table below and swapped for its translation as it appears. Names of teams and
   players stay as they are. Arabic is shown right to left. */
const LANG_NAMES = { en: 'English', es: 'Español', fr: 'Français', ar: 'العربية' };
const LOCALES = { en: 'en-GB', es: 'es-ES', fr: 'fr-FR', ar: 'ar-MA' };
const LANG = (() => { const l = settings.lang || String(navigator.language || 'en').slice(0, 2).toLowerCase(); return LANG_NAMES[l] ? l : 'en'; })();
const LOCALE = LOCALES[LANG];

const T_ROWS = [
  // Top bar and tabs
  ['Home', 'Inicio', 'Accueil', 'الرئيسية'], ['Matches', 'Partidos', 'Matchs', 'المباريات'], ['Table', 'Tabla', 'Classement', 'الترتيب'],

// Turns any text into a steady number between 0 and 1 (used for badge colours and rating "form").
function seedOf(text) {
  let h = 2166136261;
  for (const ch of String(text)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }

  return (h >>> 0) / 4294967295;

  const longest = words.sort((a, b) => b.length - a.length)[0] || String(n);
  return longest.slice(0, 3).toUpperCase();
}

/* ---------- 3. API-Football connection ----------
   Each request uses 1 of the free plan's 100 daily requests,
   so answers are saved in the browser and reused for a while (caching). */
const API_BASE = 'https://v3.football.api-sports.io';
const BLOCKED_MSG = "Couldn't reach the match data. Inside the Claude preview, outside data is blocked, so open the app from its own web address (for example GitHub Pages). If you're already doing that, check your internet connection and the server address or key in Setup.";

// ttl = how many seconds a saved answer can be reused (a number, or a function that looks at the saved answer)
// Highlightly questions go to the shared copy on the push server (normal mode only)
const viaShared = path => path.startsWith('hl/') && !!PUSH_SERVER && (settings.server || '').trim().replace(/\/+$/, '') === DATA_SERVER;
function apiUrl(path, params = {}, direct = false) {
  const shared = !direct && viaShared(path);
  if (!shared && 'final' in params) { params = { ...params }; delete params.final; } // only the push server understands "final"
  const qs = new URLSearchParams(params).toString();
  const server = (settings.server || '').trim().replace(/\/+$/, '');
  return `${shared ? PUSH_SERVER : server || API_BASE}/${path}${qs ? '?' + qs : ''}`;
}
// A saved answer, also looking under the old address (from before the shared copy) so nothing is downloaded again
function savedAnswer(path, params, tag = '') {
  const t = tag ? '#' + tag : '';
  return store.get('cache:' + apiUrl(path, params) + t, null) || (viaShared(path) ? store.get('cache:' + apiUrl(path, params, true) + t, null) : null);
}
const cachedData = (path, params, tag = '') => savedAnswer(path, params, tag)?.data ?? null;
async function api(path, params = {}, ttl = 600, force = false, tag = '') {
  const server = (settings.server || '').trim().replace(/\/+$/, '');
  const url = apiUrl(path, params);
  const cacheKey = 'cache:' + url + (tag ? '#' + tag : '');
  const saved = savedAnswer(path, params, tag);
  const ttlSec = saved ? (typeof ttl === 'function' ? ttl(saved.data) : ttl) : 0;
  if (!force && saved && Date.now() - saved.t < ttlSec * 1000) { if (path === 'fixtures' || path === 'fd/teams/81/matches') state.lastSync = saved.t; return saved.data; }
  if (!server && !settings.apiKey) throw new AppError('Add a data server address or API-Football key on the developer page, or press Back to normal.', 'nokey');
  let res;
  try { res = await fetch(url, server ? {} : { headers: { 'x-apisports-key': settings.apiKey } }); }
  catch (e) {
    if (viaShared(path)) { try { res = await fetch(apiUrl(path, params, true)); } catch (e2) { /* both unreachable */ } } // push server unreachable: ask the data server
    if (!res) { if (saved) return saved.data; throw new AppError(BLOCKED_MSG, 'network'); }
  }
  if (!res.ok && viaShared(path) && (res.status === 404 || res.status >= 500)) { // push server not set up or failing: ask the data server
    try { res = await fetch(apiUrl(path, params, true)); } catch (e) { /* keep the first answer */ }
  }
  if (!res.ok) {
    if (path.startsWith('hl/') && res.status === 429) HL_LIMIT.at = Date.now(); // Highlightly's daily limit is used up
    if (saved && (res.status === 429 || res.status >= 500)) return saved.data; // keep showing the last copy
    throw Object.assign(new AppError(`${server ? 'Your data server' : 'API-Football'} answered with error ${res.status}. Press Back to normal, or check the developer page.`, 'http'), { status: res.status });
  }
  const json = await res.json();
  const errs = json.errors && (Array.isArray(json.errors) ? json.errors : Object.values(json.errors));
  if (errs && errs.length) throw new AppError('API-Football says: ' + String(errs[0]), 'api');
  store.set(cacheKey, { t: Date.now(), data: json });
  if (path === 'fixtures' || path === 'fd/teams/81/matches') state.lastSync = Date.now();
  return json;
}

/* The live clock: API-Football updates every 15 seconds, so between updates

const liveBase = {};
function noteLive(f) {
  if (f.source !== 'api' && f.source !== 'real') return;
  if (f.status !== 'LIVE' && f.status !== 'HT') { delete liveBase[f.id]; return; }
  const b = liveBase[f.id];
  if (!b || b.elapsed !== f.elapsed || b.status !== f.status) liveBase[f.id] = { status: f.status, elapsed: f.elapsed, extra: f.extraNow, at: Date.now() };
  else b.extra = f.extraNow;
}
function clockText(id) {
  const b = liveBase[id];
  if (!b) return '';
  if (b.status === 'HT') return 'HT';
  if (b.elapsed == null) return 'LIVE';
  if (b.extra) return `${b.elapsed}+${b.extra}'`;
  const end = b.elapsed <= 45 ? 45 : b.elapsed <= 90 ? 90 : b.elapsed <= 105 ? 105 : 120;
  const secs = (b.elapsed - 1) * 60 + Math.floor((Date.now() - b.at) / 1000);
  if (secs >= end * 60) return `${end}+'`;
  return `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
}
const agoText = () => state.lastSync ? `updated ${Math.max(0, Math.round((Date.now() - state.lastSync) / 1000))} s ago` : '';

const STAT_MAP = { 'Shots insidebox': 'shotsIn', 'Shots outsidebox': 'shotsOut', 'Blocked Shots': 'blocked', 'Ball Possession': 'possession', 'expected_goals': 'xg', 'Total Shots': 'shots', 'Shots on Goal': 'sot', 'Corner Kicks': 'corners', 'Fouls': 'fouls', 'Offsides': 'offsides', 'Yellow Cards': 'yellow', 'Red Cards': 'red', 'Goalkeeper Saves': 'saves', 'Total passes': 'passes', 'Passes %': 'passAcc' };
function mapStats(list) {
  const o = {};
  list.forEach(s => {
    const k = STAT_MAP[s.type]; if (!k) return;
    let v = s.value;
    if (v == null) v = k === 'xg' ? null : 0;
    else if (typeof v === 'string') v = parseFloat(v);

// Turns one full API match (events, lineups, stats, ratings) into the app's own shape
function normDetail(f) {
  const m = normFixture(f);
  const sideOf = teamId => teamId === m.home.id ? 'home' : 'away';
  const pl = p => ({ id: String(p.id ?? p.name), name: p.name || '?', number: p.number, pos: p.pos || 'M', grid: p.grid || null });
  m.lineups = null;
  if (f.lineups?.length === 2) {
    m.lineups = {};
    f.lineups.forEach(l => { m.lineups[sideOf(l.team.id)] = { formation: l.formation || '', xi: (l.startXI || []).map(x => pl(x.player)), bench: (l.substitutes || []).map(x => pl(x.player)) }; });
    if (!m.lineups.home || !m.lineups.away || !m.lineups.home.xi.length) m.lineups = null;
  }
  const ids = new Set(), byName = { home: {}, away: {} };
  if (m.lineups) for (const s of ['home', 'away']) [...m.lineups[s].xi, ...m.lineups[s].bench].forEach(p => { ids.add(p.id); byName[s][p.name] = p.id; });
  const rid = (side, p) => {
    if (!p || (p.id == null && !p.name)) return null;
    const sid = p.id != null ? String(p.id) : null;
    if (sid && ids.has(sid)) return sid;
    if (p.name && byName[side][p.name]) return byName[side][p.name];
    return sid ?? p.name;
  };
  // To tell who came off in a substitution, we track who is on the pitch
  const onPitch = { home: new Set(m.lineups ? m.lineups.home.xi.map(p => p.id) : []), away: new Set(m.lineups ? m.lineups.away.xi.map(p => p.id) : []) };
  const raw = (f.events || []).filter(e => !/shootout/i.test(e.comments || ''))
    .sort((a, b) => (a.time.elapsed - b.time.elapsed) || ((a.time.extra || 0) - (b.time.extra || 0)));
  m.events = [];
  for (const e of raw) {
    const side = sideOf(e.team?.id);
    const base = { min: e.time.elapsed ?? 0, extra: e.time.extra || 0, side, player: rid(side, e.player), playerName: e.player?.name || null, assist: rid(side, e.assist), assistName: e.assist?.name || null };
    const type = String(e.type || '').toLowerCase(), det = String(e.detail || '');
    if (type === 'goal') {
      if (/missed/i.test(det)) m.events.push({ ...base, type: 'pen_miss', assist: null });
      else if (/own/i.test(det)) m.events.push({ ...base, type: 'own', assist: null });

/* ---------- 3i. Match videos ----------
   Highlightly finds highlight and goal videos for a match (mostly YouTube). Official uploads
   are listed first. Videos play inside the app, or open on the site they came from. */
const decodeHTML = t => { const el = document.createElement('textarea'); el.innerHTML = t; return el.value; }; // YouTube titles come with &amp; and &#39;
async function videosFor(m) {
  const after = new Date(m.ts - 3600e3).toISOString(), before = new Date(m.ts + 7 * 86400e3).toISOString();
  const json = await api('yt/search', { q: `${m.home.name} ${m.away.name}`, after, before }, m.ts + 7 * 86400e3 < Date.now() ? 30 * 86400 : 3 * 3600);
  const list = (json.videos || []).map(v => ({ title: decodeHTML(v.title || ''), url: 'https://www.youtube.com/watch?v=' + v.id, embedUrl: 'https://www.youtube-nocookie.com/embed/' + v.id, imgUrl: v.thumb, channel: decodeHTML(v.channel || ''), type: 'VERIFIED' }));
  const main = v => /highlight|resumen|résumé|resume|ملخص/i.test(v.title) ? 1 : 0;
  return list.sort((a, b) => main(b) - main(a)); // full highlights first, then goal clips
}
function goalVideo(m, e) { // a video whose title names this goal's scorer
  const v = state.cache['vid:' + m.id];
  if (!v || !v.data || !v.data.length) return -1;
  const w = nameWords(e.playerName || pname(m, e.player, ''));
  const last = w[w.length - 1]; if (!last) return -1;
  return v.data.findIndex(x => { const t = normName(x.title || ''); return t.includes(last) && /goal|gol|but/.test(t); });
}

/* ---------- 4. Data layer ----------
   Screens ask Data for things; Data decides whether to use demo or API data. */
const state = { fixtures: null, matchTab: 'upcoming', comp: 'all', mcTab: 'timeline', pred: {}, lastTab: 'home', scrubbing: false, cache: {}, sheetPid: null, sheetReturn: null, gen: 0 };

const Data = {
  async fixtures(force = false) {
    if (settings.mode === 'demo') return (state.fixtures = demoFixtures());
    if (settings.mode === 'real') {
      const gen = state.gen; // ignore answers that arrive after the data source changed
      let list = null, source = 'fd';
      if (fdReady()) { try { list = await fdFixtures(force); } catch (e) { list = null; } }
      if (!list || !list.length) { list = srFixtures(); source = 'sr'; }
      if (source === 'fd') { try { list = await hlAttach(list); } catch (e) { /* no Highlightly: carry on */ } }
      if (gen !== state.gen) return list;
      state.source = source;
      if (source === 'sr') state.lastSync = SR.at;
      list.forEach(noteLive);
      return (state.fixtures = list);
    }
    const liveOrSoon = data => (data.response || []).some(f => {
      const s = normStatus(f.fixture.status.short), dt = f.fixture.timestamp * 1000 - Date.now();
      return s === 'LIVE' || s === 'HT' || (s === 'NS' && dt < 15 * 60e3 && dt > -3 * 3600e3);
    });
    const json = await api('fixtures', { team: BARCA_ID, season: settings.season }, data => liveOrSoon(data) ? settings.refresh : 1800, force);
    const list = (json.response || []).map(normFixture).sort((a, b) => a.ts - b.ts);
    list.forEach(noteLive);
    if (state.fixtures && settings.alerts) announceScoreChanges(state.fixtures, list);
    return (state.fixtures = list);
  },
  async match(id, force = false) {
    if (settings.mode === 'demo') return demoMatch(id);
    if (settings.mode === 'real') {
      let f = String(id).startsWith('sr') ? srFixtures().find(x => String(x.id) === String(id)) : null;
      if (!f) f = (state.fixtures || await Data.fixtures()).find(x => String(x.id) === String(id));
      if (!f) throw new AppError('This match could not be found.');
      if (f.hlId) {
        const hm = await hlDetail(f);
        if (hm) {
          // fill in team stats from the built-in data if Highlightly has none
          if (!hm.stats && f.srTwin) { const sm = srMatch(f, await SR.game(f.srTwin)); hm.stats = sm.stats; }
          await withEspn(hm, f); // Highlightly had no events: goals and cards from ESPN
          attachPhotos(hm);
          noteLive(hm);
          return hm;
        }
      }
      const twin = f.fd ? f.srTwin : f;
      const m = srMatch(f, twin ? await SR.game(twin) : null);
      if (f.hlId && f.status !== 'NS') m.hlDown = Date.now() - HL_LIMIT.at < 3 * 3600e3 ? 'limit' : 'down'; // Highlightly couldn't be reached
      await withEspn(m, f);
      noteLive(m);
      return m;
    }
    if (Clock.m && String(Clock.m.id) === String(id)) return Clock.m; // keep a running replay
    const ttl = data => { const s = normStatus(data.response?.[0]?.fixture?.status?.short); return s === 'FT' ? 7 * 86400 : (s === 'LIVE' || s === 'HT') ? settings.refresh : 300; };
    const json = await api('fixtures', { id }, ttl, force);
    const f = json.response && json.response[0];
    if (!f) throw new AppError('This match could not be found.');
    const m = normDetail(f);
    noteLive(m);
    return m;
  },
  async standings() {
    if (settings.mode === 'demo') return demoTable();
    if (settings.mode === 'real') {
      if (fdReady()) {
        try {
          const json = await fdGet('competitions/PD/standings', {}, 300);
          const total = (json.standings || []).find(t => t.type === 'TOTAL') || (json.standings || [])[0];
          const rows = (total?.table || []).map(r => ({ rank: r.position, team: fdTeam(r.team || {}), p: r.playedGames, w: r.won, d: r.draw, l: r.lost, gf: r.goalsFor, ga: r.goalsAgainst, gd: r.goalDifference, pts: r.points, zone: zoneByRank(r.position), form: String(r.form || '').replace(/[^WDL]/g, '') }));
          if (rows.length) return { title: `La Liga ${seasonLabel(2026)}`, rows, live: false, note: '' };

    const zone = d => /champions/i.test(d || '') ? 'ucl' : /europa league/i.test(d || '') ? 'uel' : /conference/i.test(d || '') ? 'uecl' : /relegation/i.test(d || '') ? 'rel' : '';
    const rows = list.map(r => ({ rank: r.rank, team: { id: r.team.id, name: r.team.name }, p: r.all.played, w: r.all.win, d: r.all.draw, l: r.all.lose, gf: r.all.goals.for, ga: r.all.goals.against, gd: r.goalsDiff, pts: r.points, form: r.form || '', zone: zone(r.description) }));

                (sj.scorers || []).forEach(sc => {
                  if (sc.team?.id !== 81) return;

                  x.goals += sc.goals || 0; x.assists += sc.assists || 0; x.apps += sc.playedMatches || 0;

            }

            const season = await hlSeason(false).catch(() => null);

            if (season && season.have && !season.missing) {

                const fdp = list.find(pl => !used.has(pl.id) && (normName(pl.name) === normName(a.name) || words.includes(normName(pl.name).split(' ').pop()) || (words.length === 1 && normName(pl.name).split(' ')[0] === words[0])));
                const target = fdp || (a.minutes > 0 ? (list.push({ id: 'hl' + a.id, name: a.name, number: null, pos: a.pos, age: null }), list[list.length - 1]) : null);
                if (!target) return;
                used.add(target.id);
                Object.assign(target, { number: target.number ?? a.number, apps: a.apps, starts: a.starts, minutes: a.minutes, goals: a.goals, assists: a.assists, rating: a.rating, rN: a.rN, xg: Math.round(a.xg * 100) / 100, s: a.s, pos: target.pos || a.pos });
              });
              state.seasonFull = true;
            } else state.seasonFull = false;
            state.topScorers = list.filter(pl => pl.goals).sort((a, b) => b.goals - a.goals || b.assists - a.assists).slice(0, 5);

      }

    if (settings.mode === 'demo') {

    }
    let page = 1, total = 1, all = [];
    do {

    } while (page <= total && page <= 4);
    const posMap = { Goalkeeper: 'G', Defender: 'D', Midfielder: 'M', Attacker: 'F' };
    return all.map(p => {
      const st = (p.statistics || []).filter(s => s.team?.id === BARCA_ID);
      const sum = f => st.reduce((n, s) => n + (f(s) || 0), 0);
      const apps = sum(s => s.games.appearences);

      const rating = rated.length ? rated.reduce((n, s) => n + parseFloat(s.games.rating) * s.games.appearences, 0) / rated.reduce((n, s) => n + s.games.appearences, 0) : null;

  },
  async h2h(m) {

    const json = await api('fixtures/headtohead', { h2h: `${BARCA_ID}-${opp.id}`, last: 10 }, 86400);
    return (json.response || []).map(normFixture).filter(f => f.status === 'FT').sort((a, b) => b.ts - a.ts);
  },
  async injuries(m) {
    const json = await api('injuries', { fixture: m.id }, 3600);
    return (json.response || []).map(x => ({ side: x.team?.id === m.home.id ? 'home' : 'away', name: x.player?.name || '?', type: x.player?.type || '', reason: x.player?.reason || '' }));

/* ---------- 5. Match engine ----------
   A match is split into "ticks" (one per minute, plus added time, half-time and full-time).
   stateAt(match, tick) works out everything at that moment: score, events so far,
   who is on the pitch, player ratings and stats. Replays just move through the ticks. */
function buildTicks(m) {
  const ev = m.events || [];
  const maxExtra = minute => Math.max(0, ...ev.filter(e => e.min === minute).map(e => e.extra || 0));
  let s1 = Math.max(m.added?.h1 ?? 2, maxExtra(45));
  let s2 = Math.max(m.added?.h2 ?? 3, maxExtra(90));
  if (m.elapsed === 45 && m.extraNow) s1 = Math.max(s1, m.extraNow);
  if (m.elapsed === 90 && m.extraNow) s2 = Math.max(s2, m.extraNow);
  const ticks = [];
  for (let i = 0; i <= 45; i++) ticks.push({ min: i, extra: 0 });
  for (let i = 1; i <= s1; i++) ticks.push({ min: 45, extra: i });
  ticks.push({ min: 45, extra: 99, ht: true });
  for (let i = 46; i <= 90; i++) ticks.push({ min: i, extra: 0 });
  for (let i = 1; i <= s2; i++) ticks.push({ min: 90, extra: i });
  if (ev.some(e => e.min > 90) || ['AET', 'PEN', 'ET', 'BT', 'P'].includes(m.short)) {
    const s3 = Math.max(1, maxExtra(105)), s4 = Math.max(1, maxExtra(120));
    for (let i = 91; i <= 105; i++) ticks.push({ min: i, extra: 0 });
    for (let i = 1; i <= s3; i++) ticks.push({ min: 105, extra: i });
    for (let i = 106; i <= 120; i++) ticks.push({ min: i, extra: 0 });
    for (let i = 1; i <= s4; i++) ticks.push({ min: 120, extra: i });
  }
  ticks.push({ min: 999, extra: 0, ft: true });
  ticks.forEach(t => { t.key = t.min * 100 + t.extra; });
  return ticks;
}

function prep(m) {
  if (m._prep) return m._prep;
  const ticks = buildTicks(m);
  const idx = {};
  for (const side of ['home', 'away']) {
    const L = m.lineups?.[side]; if (!L) continue;
    L.xi.forEach(p => { idx[p.id] = { p, side, starter: true }; });
    L.bench.forEach(p => { idx[p.id] = { p, side, starter: false }; });
  }
  const events = (m.events || []).map((e, i) => ({ ...e, key: e.min * 100 + (e.extra || 0), n: i })).sort((a, b) => a.key - b.key || a.n - b.n);
  events.forEach(e => {
    if (e.type === 'goal' || e.type === 'pen') e.scoreSide = e.side;
    if (e.type === 'own') e.scoreSide = other(e.side);
  });
  // Own goals: check against the final score and flip if needed
  if (m.status === 'FT' && m.goals?.home != null && events.some(e => e.type === 'own')) {
    const c = { home: 0, away: 0 }; events.forEach(e => { if (e.scoreSide) c[e.scoreSide]++; });
    if (c.home !== m.goals.home || c.away !== m.goals.away) events.forEach(e => { if (e.type === 'own') e.scoreSide = e.side; });
  }
  const playKeys = ticks.filter(t => !t.ht && !t.ft && t.key > 0).map(t => t.key);
  return (m._prep = { ticks, idx, events, playKeys });
}

const minutesBetween = (P, fromKey, toKey) => { let n = 0; for (const k of P.playKeys) if (k > fromKey && k <= toKey) n++; return n; };
const shareAt = (P, key) => P.playKeys.length ? minutesBetween(P, -1, key) / P.playKeys.length : 0;

function stateAt(m, i, opt = {}) {
  const P = prep(m);
  i = Math.max(0, Math.min(i, P.ticks.length - 1));
  const tick = P.ticks[i], k = tick.key;
  const events = P.events.filter(e => e.key <= k);
  const score = { home: 0, away: 0 };
  events.forEach(e => { if (e.scoreSide) score[e.scoreSide]++; });
  if (opt.actual && m.goals?.home != null) { score.home = m.goals.home; score.away = m.goals.away; }

  // When each player came on and went off
  const spans = {};
  for (const id in P.idx) if (P.idx[id].starter) spans[id] = { inKey: 0, outKey: Infinity };
  for (const e of events) {
    if (e.type === 'sub') { if (spans[e.out]) spans[e.out].outKey = e.key; if (e.in != null && P.idx[e.in]) spans[e.in] = { inKey: e.key, outKey: Infinity }; }
    if (e.type === 'red' && spans[e.player]) spans[e.player].outKey = e.key;
  }
  const minutes = {}, ratings = {};
  for (const id in spans) {
    const s = spans[id];
    minutes[id] = minutesBetween(P, s.inKey, Math.min(s.outKey, k));
    const off = opt.official && m.official && m.official[id] != null;
    ratings[id] = off ? m.official[id] : rateByFormula(P, id, s, minutes[id], events);
  }
  const progress = shareAt(P, k);
  const stats = statsAt(m, i, events, score, progress, opt.actual);
  return { i, tick, k, events, score, spans, minutes, ratings, stats, progress, isFT: !!tick.ft, isHT: !!tick.ht };
}

/* Culé Live's own rating formula (used for the demo and for replays).
   Everyone starts at 6.0 and goes up or down with what happens while they play. */
function rateByFormula(P, id, span, mins, events) {
  if (mins < 1) return null;
  const { side, p } = P.idx[id];
  const defensive = p.pos === 'G' || p.pos === 'D';
  const share = Math.min(1, mins / 90);
  let r = 6.0 + 0.6 * share + (seedOf(id) - 0.5) * 0.6 * share; // playing time + a little "form"
  let conceded = 0;
  for (const e of events) {
    if (e.player === id) {
      if (e.type === 'goal') r += 1.0;
      if (e.type === 'pen') r += 0.8;
      if (e.type === 'own') r -= 1.0;
      if (e.type === 'yellow') r -= 0.3;
      if (e.type === 'red') r -= 1.5;
      if (e.type === 'pen_miss') r -= 0.6;
    }
    if (e.assist === id && (e.type === 'goal' || e.type === 'pen')) r += 0.6;
    if (e.savedBy === id) r += 0.8;
    if (e.scoreSide && e.key > span.inKey && e.key <= span.outKey) {
      if (e.scoreSide === side) r += 0.1;
      else { conceded++; r -= defensive ? 0.25 : 0.1; }
    }
  }
  if (defensive && mins >= 60 && conceded === 0) r += 0.3; // clean sheet bonus
  return Math.round(Math.max(3, Math.min(10, r)) * 10) / 10;
}

const STAT_ROWS = [['possession', 'Possession', '%'], ['xg', 'Expected goals (xG)', ''], ['bigChances', 'Big chances', ''], ['shots', 'Total shots', ''], ['sot', 'Shots on target', ''], ['shotsOff', 'Shots off target', ''], ['shotsIn', 'Shots inside the box', ''], ['shotsOut', 'Shots outside the box', ''], ['blocked', 'Blocked shots', ''], ['corners', 'Corners', ''], ['keyPasses', 'Key passes', ''], ['passes', 'Passes', ''], ['passAcc', 'Pass accuracy', '%'], ['tackles', 'Tackles', ''], ['interceptions', 'Interceptions', ''], ['clearances', 'Clearances', ''], ['fouls', 'Fouls', ''], ['offsides', 'Offsides', ''], ['yellow', 'Yellow cards', ''], ['red', 'Red cards', ''], ['saves', 'Goalkeeper saves', ''], ['freeKicks', 'Free kicks', ''], ['throwIns', 'Throw-ins', '']];

// Final stats are known; during a replay they grow in step with the clock.
function statsAt(m, i, events, score, f, actual) {
  const fin = m.stats;
  if (!fin || !fin.home || !fin.away) return null;
  if (actual) return fin;
  const out = { home: {}, away: {} };
  for (const side of ['home', 'away']) {
    const F = fin[side], o = out[side];
    const grow = key => F[key] == null ? null : Math.round(F[key] * f);
    ['shots', 'sot', 'shotsIn', 'shotsOut', 'blocked', 'corners', 'fouls', 'offsides', 'passes', 'saves'].forEach(key => { o[key] = grow(key); });
    o.xg = F.xg == null ? null : Math.round(F.xg * f * 100) / 100;
    o.passAcc = F.passAcc ?? null;
    if (o.sot != null) o.sot = Math.max(o.sot, score[side]);
    if (o.shots != null && o.sot != null) o.shots = Math.max(o.shots, o.sot);
    o.yellow = events.filter(e => e.side === side && e.type === 'yellow').length;
    o.red = events.filter(e => e.side === side && e.type === 'red').length;
    if (o.offsides != null) o.offsides = Math.max(o.offsides, events.filter(e => e.side === side && e.type === 'var' && /offside/i.test(e.text || '')).length);
  }
  for (const side of ['home', 'away']) {
    const opp = other(side);
    if (out[side].saves != null && out[opp].sot != null) out[side].saves = Math.min(out[side].saves, Math.max(0, out[opp].sot - score[opp]));
  }
  if (fin.home.possession != null) {
    const wobble = (1 - f) * 6 * Math.sin(i * 0.7); // possession moves around early, then settles
    const h = Math.round(Math.max(30, Math.min(70, fin.home.possession + wobble)));
    out.home.possession = h; out.away.possession = 100 - h;
  }
  return out;
}

const minuteLabel = t => !t ? '' : t.ft ? 'FT' : t.ht ? 'HT' : t.extra ? `${t.min}+${t.extra}'` : `${t.min}'`;
const evMinute = e => e.extra ? `${e.min}+${e.extra}'` : `${e.min}'`;

function actualIdx(m) {
  const T = prep(m).ticks;
  if (m.status === 'FT') return T.length - 1;
  if (m.status === 'NS' || m.status === 'OFF') return 0;
  if (m.status === 'HT') return T.findIndex(t => t.ht);
  if (m.elapsed == null) { // live but the minute is unknown: estimate it from the kick-off time (15-minute break), never behind the latest event
    const mins = (Date.now() - m.ts) / 60e3, est = mins <= 48 ? mins : mins < 63 ? 45 : Math.min(90, mins - 15);
    const k = Math.max(Math.max(1, Math.floor(est)) * 100, ...prep(m).events.map(e => e.key));
    let j = 0; T.forEach((t, x) => { if (!t.ft && !t.ht && t.key <= k) j = x; }); return j;
  }
  const k = (m.elapsed || 0) * 100 + (m.extraNow || 0);
  let i = 0; T.forEach((t, j) => { if (!t.ft && !t.ht && t.key <= k) i = j; });
  return i;
}
const tickIndexFor = (m, minute) => Math.max(0, prep(m).ticks.findIndex(t => t.key >= minute * 100));

/* ---------- 6. Match clock ----------
   Moves through a match one tick at a time: the live demo and replays both use it. */
const Clock = {
  m: null, mode: null, idx: 0, playing: false, speed: 1, timer: null, memo: null,
  load(m, mode, idx = 0) { this.stop(); this.m = m; this.mode = mode; this.idx = idx; this.memo = null; },
  stop() { this.playing = false; clearTimeout(this.timer); },
  unload() { this.stop(); this.m = null; this.mode = null; },
  get max() { return prep(this.m).ticks.length - 1; },
  state() {
    if (!this.m) return null;
    if (this.memo && this.memo.i === this.idx && this.memo.m === this.m) return this.memo.st;
    const st = stateAt(this.m, this.idx);
    this.memo = { i: this.idx, m: this.m, st };
    return st;
  },
  play() { if (!this.m) return; if (this.idx >= this.max) this.idx = 0; this.playing = true; this.schedule(); },
  toggle() { if (this.playing) this.stop(); else this.play(); onClockChange([]); },
  schedule() {
    clearTimeout(this.timer);
    if (!this.playing) return;
    const t = prep(this.m).ticks[this.idx];
    this.timer = setTimeout(() => this.step(), (t.ht ? 3500 : 1000) / this.speed);
  },
  step() {
    const P = prep(this.m);
    if (this.idx >= this.max) { this.stop(); onClockChange([]); return; }
    const before = P.ticks[this.idx].key;
    this.idx++;
    const t = P.ticks[this.idx];
    const fresh = P.events.filter(e => e.key > before && e.key <= t.key);
    if (settings.alerts) {
      fresh.forEach(e => alertFor(this.m, e));
      if (t.ht) toast(`<b>Half-time</b><span>${scoreLine(this.m, this.state().score)}</span>`);
      if (t.ft) toast(`<b>Full time</b><span>${scoreLine(this.m, this.state().score)}</span>`);
    }
    if (t.ft) this.stop();
    onClockChange(fresh);
    if (this.playing) this.schedule();
  },
  seek(i) { this.idx = Math.max(0, Math.min(i, this.max)); onClockChange([]); if (this.playing) this.schedule(); },
  setSpeed(s) { this.speed = s; if (this.playing) this.schedule(); onClockChange([]); }
};

/* --- Predictions ---
   Saved under the match day and whether Barça is home or away (for example "2026-11-03-H"),
   because the match's ID number is different in each data source. Saved on this device,
   and in your account when you're signed in. */
const predKey = f => { const d = new Date(f.ts); return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}-${barcaSide(f) === 'home' ? 'H' : 'A'}`; };
function getPred(f) {
  const k = predKey(f);
  let p = store.get('pred:' + k, null);
  if (!p) { // move a prediction saved by an older version (under the match ID) to the new key
    for (const id of [f.id, f.srTwin?.id, f.hlId && 'h' + f.hlId].filter(Boolean)) {
      const old = store.get('pred:' + id, null);
      if (old && old.b != null) { p = { b: old.b, o: old.o, at: old.at || Date.now() }; store.set('pred:' + k, p); break; }
    }

}
const PRED_RX = /^\d{4}-\d{2}-\d{2}-[HA]$/;
function localPredKeys() { try { return Object.keys(localStorage).filter(k => k.startsWith('cule:pred:')).map(k => k.slice(10)).filter(k => PRED_RX.test(k)); } catch (e) { return []; } }
function predPoints(p, f) {
  const v = fxView(f), bs = barcaSide(f), os = other(bs);
  if (v.status !== 'FT' || v.score[bs] == null) return null;
  if (p.b === v.score[bs] && p.o === v.score[os]) return 3;

}

}
async function savePred(f, d) {
  const k = predKey(f), rec = { b: d.b, o: d.o, at: Date.now(), opp: f[other(barcaSide(f))].name, ts: f.ts };

  const pill = st.isFT ? 'Full time' : st.isHT ? 'Half-time' : mode === 'api' ? fxView(m).minute : minuteLabel(st.tick);
  const pillHTML = mode === 'api' && !st.isFT && !st.isHT ? `<span data-clock="${m.id}">${esc(clockText(m.id) || pill)}</span>` : esc(pill);
  const last = st.events[st.events.length - 1];
  return `<div class="live-top"><span>${esc(m.comp.name)}${m.round ? ' · ' + esc(m.round) : ''}</span>
      <span class="live-pill">${live && !st.isHT ? '<span class="dot"></span>LIVE ' : ''}${pillHTML}</span></div>
